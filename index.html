<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DendyGram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- PeerJS для надійного P2P WebRTC зв'язку між гравцями -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      background: #121214;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }

    .console {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 820px;
      background: #272730;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 2px 3px rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      padding: 12px 8px;
      touch-action: none;
    }

    .screen-bezel {
      background: #111113;
      border-radius: 16px;
      padding: 8px 8px 6px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 4px;
    }

    .brand {
      color: #71717a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 6px;
      transition: color 0.3s ease;
    }

    #game-container {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    #game {
      width: 100% !important;
      height: 100% !important;
    }

    /* Екран очікування підключення */
    #waiting-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #09090b;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fafafa;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Приховування зайвих оверлеїв налаштувань EmulatorJS */
    #game * [class*="ejs_"],
    #game * [id*="controls"],
    #game * [id*="gamepad"],
    #game .ejs_menu,
    #game .ejs_virtual_gamepad,
    #game .ejs_start_screen {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 4px 10px;
    }

    .main-pads {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 2px;
    }

    .dpad {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .dpad-btn {
      position: absolute;
      background: #1c1c22;
      border: 2px solid #0f0f13;
      box-shadow: 0 4px 0 #09090b;
      border-radius: 6px;
      cursor: pointer;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      box-shadow: 0 1px 0 #09090b;
      transform: translateY(3px);
      background: #2b2b35;
    }

    .dpad-up { top: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-down { bottom: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-left { top: 45px; left: 0; width: 45px; height: 40px; }
    .dpad-right { top: 45px; right: 0; width: 45px; height: 40px; }
    .dpad-center {
      position: absolute;
      top: 45px;
      left: 45px;
      width: 40px;
      height: 40px;
      background: #1c1c22;
    }

    .action-buttons {
      display: flex;
      gap: 14px;
      transform: rotate(-25deg);
      margin-right: 2px;
    }

    .action-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dc2626;
      border: 2px solid #7f1d1d;
      box-shadow: 0 5px 0 #500724;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .action-btn:active, .action-btn.pressed {
      box-shadow: 0 1px 0 #500724;
      transform: translateY(4px);
      background: #ef4444;
    }

    .system-pads {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 8px;
    }

    .sys-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .sys-btn {
      width: 48px;
      height: 14px;
      background: #52525b;
      border: 1px solid #27272a;
      border-radius: 8px;
      transform: rotate(-25deg);
      box-shadow: 0 2px 0 #18181b;
      cursor: pointer;
    }

    .sys-btn:active, .sys-btn.pressed {
      box-shadow: none;
      transform: rotate(-25deg) translateY(2px);
    }

    .sys-label {
      font-size: 10px;
      color: #a1a1aa;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="console">
    <div class="screen-bezel">
      <div id="game-container">
        <div id="game"></div>
        <div id="waiting-overlay">
          <div class="spinner"></div>
          <div style="font-weight: 700; font-size: 14px; margin-bottom: 6px;">ОЧІКУЄМО ХОСТА...</div>
          <div style="color: #71717a; font-size: 11px;">Player 1 ще не запустив гру. Зачекай хвилинку!</div>
        </div>
      </div>
      <div class="brand">DENDYGRAM • PORTABLE</div>
    </div>

    <div class="controls">
      <div class="main-pads">
        <div class="dpad">
          <div class="dpad-center"></div>
          <div class="dpad-btn dpad-up" data-key="ArrowUp"></div>
          <div class="dpad-btn dpad-down" data-key="ArrowDown"></div>
          <div class="dpad-btn dpad-left" data-key="ArrowLeft"></div>
          <div class="dpad-btn dpad-right" data-key="ArrowRight"></div>
        </div>

        <div class="action-buttons">
          <div class="action-btn" data-key="KeyZ">B</div>
          <div class="action-btn" data-key="KeyX">A</div>
        </div>
      </div>

      <div class="system-pads">
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-key="ShiftLeft"></div>
          <span class="sys-label">SELECT</span>
        </div>
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-key="Enter"></div>
          <span class="sys-label">START</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    function decodeBase64Url(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return decodeURIComponent(escape(atob(str)));
    }

    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const urlParams = new URLSearchParams(window.location.search);

    let targetRom = hashParams.get('rom') || urlParams.get('rom') || urlParams.get('startapp') || tg?.initDataUnsafe?.start_param;
    const roomId = hashParams.get('room') || urlParams.get('room');
    const playerNum = parseInt(hashParams.get('player') || urlParams.get('player') || '1', 10);

    const brandElem = document.querySelector('.brand');
    const waitingOverlay = document.getElementById('waiting-overlay');

    if (roomId && brandElem) {
      brandElem.textContent = `DENDYGRAM • DUO (P${playerNum})`;
      brandElem.style.color = playerNum === 1 ? '#38bdf8' : '#34d399';
    }

    let isEmulatorStarted = false;
    function startEmulator() {
      if (isEmulatorStarted || !targetRom) return;
      isEmulatorStarted = true;
      waitingOverlay.style.display = 'none';

      try {
        if (!targetRom.startsWith('http')) {
          targetRom = decodeBase64Url(targetRom);
        } else {
          targetRom = decodeURIComponent(targetRom);
        }
      } catch (e) {
        console.error("Помилка декодування:", e);
      }

      window.EJS_player = '#game';
      window.EJS_core = 'nes';
      window.EJS_gameUrl = targetRom;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_alignStartButton = false;
      window.EJS_disableToolbar = true;
      window.EJS_VirtualGamepadSettings = [0, 0];
      window.EJS_mouse = false;

      const loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(loader);
    }

    // P2P Мережева синхронізація через PeerJS
    let peer = null;
    let dataConnection = null;

    if (roomId) {
      const peerRoomId = `dendygram_room_${roomId}`;

      if (playerNum === 1) {
        // ХОСТ: реєструє кімнату й одразу стартує гру
        peer = new Peer(peerRoomId);
        startEmulator();

        peer.on('connection', (conn) => {
          dataConnection = conn;
          brandElem.textContent = "DENDYGRAM • DUO CONNECTED!";
          brandElem.style.color = "#22c55e";

          // Прийом інпутів від Player 2
          conn.on('data', (data) => {
            if (data && data.btnId !== undefined) {
              try {
                window.EJS_emulator?.controls?.simulateButton(1, data.btnId, data.val);
              } catch (e) {}
            }
          });
        });
      } else {
        // PLAYER 2: підключається до хоста. Якщо хоста нема — екран очікування
        waitingOverlay.style.display = 'flex';
        peer = new Peer();

        function connectToHost() {
          const conn = peer.connect(peerRoomId, { reliable: true });
          dataConnection = conn;

          conn.on('open', () => {
            console.log("Підключено до хоста!");
            startEmulator();
          });

          conn.on('close', () => {
            waitingOverlay.style.display = 'flex';
          });
        }

        peer.on('open', () => {
          connectToHost();
        });

        peer.on('error', (err) => {
          console.warn("Очікуємо підключення хоста...", err);
          // Повторна спроба підключення кожні 3 секунди
          setTimeout(connectToHost, 3000);
        });
      }
    } else {
      // Соло гра
      startEmulator();
    }

    // Обробка керування
    const ejsBtnMap = {
      KeyZ: 0,
      KeyX: 8,
      ShiftLeft: 2,
      Enter: 3,
      ArrowUp: 4,
      ArrowDown: 5,
      ArrowLeft: 6,
      ArrowRight: 7
    };

    function triggerKey(code, type) {
      const isDown = (type === 'keydown');
      const val = isDown ? 1 : 0;
      const btnId = ejsBtnMap[code];

      if (roomId && playerNum === 2) {
        // P2 шле інпут хосту по WebRTC і натискає в себе
        if (dataConnection && dataConnection.open && btnId !== undefined) {
          dataConnection.send({ btnId, val });
        }
        try {
          window.EJS_emulator?.controls?.simulateButton(1, btnId, val);
        } catch (e) {}
        return;
      }

      // Для соло або хоста P1
      try {
        if (window.EJS_emulator?.controls?.simulateButton && btnId !== undefined) {
          window.EJS_emulator.controls.simulateButton(0, btnId, val);
        }
      } catch (err) {}
    }

    document.querySelectorAll('[data-key]').forEach(elem => {
      const code = elem.getAttribute('data-key');

      const handlePress = (e) => {
        e.preventDefault();
        elem.classList.add('pressed');
        if (tg?.HapticFeedback) {
          tg.HapticFeedback.impactOccurred('medium');
        } else if (navigator.vibrate) {
          navigator.vibrate(12);
        }
        triggerKey(code, 'keydown');
      };

      const handleRelease = (e) => {
        e.preventDefault();
        elem.classList.remove('pressed');
        triggerKey(code, 'keyup');
      };

      elem.addEventListener('pointerdown', handlePress);
      elem.addEventListener('pointerup', handleRelease);
      elem.addEventListener('pointercancel', handleRelease);
      elem.addEventListener('pointerleave', handleRelease);
    });
  </script>
</body>
</html>

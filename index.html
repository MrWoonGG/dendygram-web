<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DendyGram RAM Stream</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      margin: 0;
      background: #121214;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }

    .console {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 820px;
      background: #272730;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 2px 3px rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      padding: 12px 8px;
      touch-action: none;
      position: relative;
    }

    .screen-bezel {
      background: #111113;
      border-radius: 16px;
      padding: 8px 8px 6px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 4px;
    }

    .brand {
      color: #71717a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 6px;
      transition: color 0.3s ease;
      text-transform: uppercase;
    }

    #game-container {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    #game {
      width: 100% !important;
      height: 100% !important;
    }

    #game canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      image-rendering: -moz-crisp-edges !important;
      image-rendering: -webkit-crisp-edges !important;
      image-rendering: pixelated !important;
      image-rendering: crisp-edges !important;
      background: #000;
    }

    #game .ejs_virtual_gamepad,
    #game .ejs_menu,
    #game .ejs_start_screen,
    #game [id*="controls_menu"] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .logger-wrapper {
      position: relative;
      margin: 6px 4px;
    }

    #screen-logger {
      height: 80px;
      background: rgba(10, 10, 14, 0.92);
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 10px;
      line-height: 1.35;
      color: #22c55e;
      overflow-y: auto;
      word-break: break-all;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
      z-index: 50;
      touch-action: pan-y !important;
      -webkit-user-select: text !important;
      user-select: text !important;
      cursor: text;
    }

    #screen-logger * {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    .copy-log-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #27272a;
      border: 1px solid #52525b;
      color: #fafafa;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.8;
      z-index: 60;
    }

    .copy-log-btn:active {
      background: #38bdf8;
      color: #000;
    }

    .log-err { color: #ef4444; font-weight: bold; }
    .log-warn { color: #facc15; }
    .log-info { color: #38bdf8; }

    .controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 4px 10px;
    }

    .main-pads {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 2px;
    }

    .dpad {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .dpad-btn {
      position: absolute;
      background: #1c1c22;
      border: 2px solid #0f0f13;
      box-shadow: 0 4px 0 #09090b;
      border-radius: 6px;
      cursor: pointer;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      box-shadow: 0 1px 0 #09090b;
      transform: translateY(3px);
      background: #2b2b35;
    }

    .dpad-up { top: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-down { bottom: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-left { top: 45px; left: 0; width: 45px; height: 40px; }
    .dpad-right { top: 45px; right: 0; width: 45px; height: 40px; }
    .dpad-center {
      position: absolute;
      top: 45px;
      left: 45px;
      width: 40px;
      height: 40px;
      background: #1c1c22;
    }

    .action-buttons {
      display: flex;
      gap: 14px;
      transform: rotate(-25deg);
      margin-right: 2px;
    }

    .action-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dc2626;
      border: 2px solid #7f1d1d;
      box-shadow: 0 5px 0 #500724;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .action-btn:active, .action-btn.pressed {
      box-shadow: 0 1px 0 #500724;
      transform: translateY(4px);
      background: #ef4444;
    }

    .system-pads {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 4px;
    }

    .sys-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .sys-btn {
      width: 48px;
      height: 14px;
      background: #52525b;
      border: 1px solid #27272a;
      border-radius: 8px;
      transform: rotate(-25deg);
      box-shadow: 0 2px 0 #18181b;
      cursor: pointer;
    }

    .sys-btn:active, .sys-btn.pressed {
      box-shadow: none;
      transform: rotate(-25deg) translateY(2px);
    }

    .sys-label {
      font-size: 10px;
      color: #a1a1aa;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="console">
    <div class="screen-bezel">
      <div id="game-container">
        <div id="game"></div>
      </div>
      <div class="brand">DENDYGRAM • RAM STREAM</div>
    </div>

    <div class="logger-wrapper">
      <div id="screen-logger"></div>
      <button class="copy-log-btn" id="copy-btn">COPY</button>
    </div>

    <div class="controls">
      <div class="main-pads">
        <div class="dpad">
          <div class="dpad-center"></div>
          <div class="dpad-btn dpad-up" data-btn="4"></div>
          <div class="dpad-btn dpad-down" data-btn="5"></div>
          <div class="dpad-btn dpad-left" data-btn="6"></div>
          <div class="dpad-btn dpad-right" data-btn="7"></div>
        </div>

        <div class="action-buttons">
          <div class="action-btn" data-btn="0">B</div>
          <div class="action-btn" data-btn="8">A</div>
        </div>
      </div>

      <div class="system-pads">
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="2"></div>
          <span class="sys-label">SELECT</span>
        </div>
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="3"></div>
          <span class="sys-label">START</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const loggerEl = document.getElementById('screen-logger');
    const copyBtn = document.getElementById('copy-btn');

    function logScreen(msg, type = 'normal') {
      if (!loggerEl) return;
      const d = document.createElement('div');
      const time = new Date().toTimeString().split(' ')[0].substring(3);
      d.textContent = `[${time}] ${msg}`;
      if (type === 'err') d.className = 'log-err';
      else if (type === 'warn') d.className = 'log-warn';
      else if (type === 'info') d.className = 'log-info';
      loggerEl.appendChild(d);
      loggerEl.scrollTop = loggerEl.scrollHeight;
    }

    if (copyBtn) {
      copyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(loggerEl.innerText).then(() => {
          logScreen("Логи скопійовано!", "info");
        });
      });
    }

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    function decodeBase64Url(str) {
      if (!str) return '';
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      try { return decodeURIComponent(escape(atob(str))); } catch (e) { return atob(str); }
    }

    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const urlParams = new URLSearchParams(window.location.search);

    let appData = {};
    const rawApp = hashParams.get('app');
    if (rawApp) {
      try { appData = JSON.parse(decodeBase64Url(rawApp)); } catch (e) {}
    }

    let targetRom = appData.rom || hashParams.get('rom') || urlParams.get('rom') || urlParams.get('startapp') || tg?.initDataUnsafe?.start_param;
    const roomId = appData.room || hashParams.get('room') || urlParams.get('room');
    const rawP = appData.p || hashParams.get('player') || hashParams.get('p') || urlParams.get('player') || urlParams.get('p');
    const isGuest = (rawP == 2 || rawP === '2');

    if (!targetRom) {
      targetRom = "https://cdn.emulatorjs.org/stable/data/roms/nes/Super%20Mario%20Bros%20(Japan,%20USA).nes";
    }

    const brandElem = document.querySelector('.brand');
    function setBrandStatus(text, color) {
      if (!brandElem) return;
      brandElem.textContent = text;
      if (color) brandElem.style.color = color;
    }

    setBrandStatus(`DENDYGRAM • ${isGuest ? 'P2 (GUEST)' : 'P1 (HOST)'}`, isGuest ? '#34d399' : '#38bdf8');
    logScreen(`Роль: ${isGuest ? 'P2' : 'P1'} | Кімната: ${roomId || 'Соло'}`);

    // --- КЛАВІАТУРНИЙ МАППІНГ ДЛЯ ДВОХ ПОРТІВ ---
    const p1Keys = {
      0: { code: 'KeyZ', key: 'z', keyCode: 90 },       // B
      8: { code: 'KeyX', key: 'x', keyCode: 88 },       // A
      2: { code: 'ShiftRight', key: 'Shift', keyCode: 16 }, // SELECT
      3: { code: 'Enter', key: 'Enter', keyCode: 13 },   // START
      4: { code: 'ArrowUp', key: 'ArrowUp', keyCode: 38 },
      5: { code: 'ArrowDown', key: 'ArrowDown', keyCode: 40 },
      6: { code: 'ArrowLeft', key: 'ArrowLeft', keyCode: 37 },
      7: { code: 'ArrowRight', key: 'ArrowRight', keyCode: 39 }
    };

    const p2Keys = {
      0: { code: 'KeyQ', key: 'q', keyCode: 81 },       // B
      8: { code: 'KeyE', key: 'e', keyCode: 69 },       // A
      2: { code: 'KeyT', key: 't', keyCode: 84 },       // SELECT
      3: { code: 'KeyY', key: 'y', keyCode: 89 },       // START
      4: { code: 'KeyI', key: 'i', keyCode: 73 },       // UP
      5: { code: 'KeyK', key: 'k', keyCode: 75 },       // DOWN
      6: { code: 'KeyJ', key: 'j', keyCode: 74 },       // LEFT
      7: { code: 'KeyL', key: 'l', keyCode: 76 }        // RIGHT
    };

    function sendEjsInput(port, btnId, val) {
      const emu = window.EJS_emulator;
      let handled = false;

      if (emu?.controls?.simulateButton) {
        try { emu.controls.simulateButton(port, btnId, val); handled = true; } catch (e) {}
      }

      const keyMap = (port === 1) ? p2Keys : p1Keys;
      const keyInfo = keyMap[btnId];
      if (keyInfo) {
        const evType = val ? 'keydown' : 'keyup';
        const ev = new KeyboardEvent(evType, {
          key: keyInfo.key,
          code: keyInfo.code,
          keyCode: keyInfo.keyCode,
          which: keyInfo.keyCode,
          bubbles: true,
          cancelable: true,
          composed: true,
          view: window
        });

        const canvas = document.querySelector('#game canvas');
        if (canvas) canvas.dispatchEvent(ev);
        window.dispatchEvent(ev);
        handled = true;
      }
      return handled;
    }

    // --- ЗАПУСК ЕМУЛЯТОРА ---
    let cleanRom = targetRom;
    try {
      if (!cleanRom.startsWith('http')) cleanRom = decodeBase64Url(cleanRom);
      else cleanRom = decodeURIComponent(cleanRom);
    } catch (e) {}

    window.EJS_player = '#game';
    window.EJS_core = 'nes';
    window.EJS_gameUrl = cleanRom;
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_alignStartButton = false;
    window.EJS_disableToolbar = true;
    window.EJS_VirtualGamepadSettings = [0, 0];
    window.EJS_mouse = false;

    window.EJS_defaultControls = {
      0: {
        0: { value: 'z' }, 8: { value: 'x' }, 2: { value: 'rshift' }, 3: { value: 'enter' },
        4: { value: 'up' }, 5: { value: 'down' }, 6: { value: 'left' }, 7: { value: 'right' }
      },
      1: {
        0: { value: 'q' }, 8: { value: 'e' }, 2: { value: 't' }, 3: { value: 'y' },
        4: { value: 'i' }, 5: { value: 'k' }, 6: { value: 'j' }, 7: { value: 'l' }
      }
    };

    let p2Locked = isGuest;

    const loader = document.createElement('script');
    loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(loader);

    // --- P2P ПІДКЛЮЧЕННЯ ---
    const meteredIceServers = [
      { urls: "stun:stun.relay.metered.ca:80" },
      { urls: "turn:global.relay.metered.ca:80", username: "d7695a22150cfea32f5b287e", credential: "Jm8+83G3JIEbY+Dj" },
      { urls: "turn:global.relay.metered.ca:443", username: "d7695a22150cfea32f5b287e", credential: "Jm8+83G3JIEbY+Dj" }
    ];

    let peer = null;
    let dataConn = null;
    let streamInterval = null;
    const hostPeerId = `dendygram_ram_${roomId}`;

    if (roomId) {
      const peerConfig = { config: { iceServers: meteredIceServers } };

      if (!isGuest) {
        // ХОСТ (P1)
        peer = new Peer(hostPeerId, peerConfig);

        peer.on('connection', (c) => {
          dataConn = c;
          setBrandStatus("DENDYGRAM • DUO STREAMING!", "#22c55e");
          logScreen("P2 підключено! Запуск потоку стейту 100мс...", "info");

          c.on('data', (d) => {
            if (d.t === 'INP') {
              sendEjsInput(1, d.b, d.v);
            }
          });

          // Постійний стрім RAM по КД (кожні 100 мс)
          if (streamInterval) clearInterval(streamInterval);
          streamInterval = setInterval(broadcastState, 100);
        });

      } else {
        // ГІСТЬ (P2)
        peer = new Peer(peerConfig);

        peer.on('open', () => {
          dataConn = peer.connect(hostPeerId, { reliable: false });

          dataConn.on('open', () => {
            setBrandStatus("DENDYGRAM • DUO CONNECTED!", "#22c55e");
            logScreen("З'єднано! Очікуємо перший стейт...", "info");
          });

          dataConn.on('data', (d) => {
            if (d.t === 'S' && d.b) {
              applyIncomingState(d.b);
            } else if (d.t === 'P1_INP') {
              sendEjsInput(0, d.b, d.v);
            }
          });
        });
      }
    }

    // Відправка стейту хостом
    function broadcastState() {
      if (!dataConn || !dataConn.open) return;
      try {
        const emu = window.EJS_emulator;
        if (emu?.gameManager?.getState) {
          const state = emu.gameManager.getState();
          if (state && state.length > 0) {
            dataConn.send({ t: 'S', b: state });
          }
        }
      } catch (e) {}
    }

    // Застосування стейту клієнтом
    function applyIncomingState(buffer) {
      try {
        const emu = window.EJS_emulator;
        if (emu?.gameManager?.loadState) {
          emu.gameManager.loadState(new Uint8Array(buffer));
          if (p2Locked) {
            p2Locked = false;
            logScreen("Перший стейт прийнято! Гру розблоковано", "info");
          }
        }
      } catch (e) {}
    }

    // Керування кнопками
    function handleButtonAction(btnId, isDown) {
      const val = isDown ? 1 : 0;

      if (isGuest) {
        sendEjsInput(1, btnId, val);
        if (dataConn && dataConn.open) {
          dataConn.send({ t: 'INP', b: btnId, v: val });
        }
        logScreen(`P2 тап: btn=${btnId} val=${val}`);
      } else {
        sendEjsInput(0, btnId, val);
        if (dataConn && dataConn.open) {
          dataConn.send({ t: 'P1_INP', b: btnId, v: val });
        }
        logScreen(`P1 тап: btn=${btnId} val=${val}`);
      }
    }

    document.querySelectorAll('[data-btn]').forEach(elem => {
      const btnId = parseInt(elem.getAttribute('data-btn'), 10);

      const down = (e) => {
        e.preventDefault();
        elem.classList.add('pressed');
        handleButtonAction(btnId, true);
      };

      const up = (e) => {
        e.preventDefault();
        elem.classList.remove('pressed');
        handleButtonAction(btnId, false);
      };

      elem.addEventListener('pointerdown', down);
      elem.addEventListener('pointerup', up);
      elem.addEventListener('pointercancel', up);
      elem.addEventListener('pointerleave', up);
    });
  </script>
</body>
</html>

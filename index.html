<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DendyGram Cloud Stream</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      margin: 0;
      background: #121214;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }

    .console {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 820px;
      background: #272730;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 2px 3px rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      padding: 12px 8px;
      touch-action: none;
      position: relative;
    }

    .screen-bezel {
      background: #111113;
      border-radius: 16px;
      padding: 8px 8px 6px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 4px;
    }

    .brand {
      color: #71717a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 6px;
      transition: color 0.3s ease;
      text-transform: uppercase;
    }

    #game-container {
      width: 100%;
      height: 240px;
      min-height: 240px;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    /* Нативне полотно емулятора та відеопотік хмарного стріму */
    #game, #cloud-video {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      object-fit: contain !important;
      background: #000;
    }

    #cloud-video, #game canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      image-rendering: -moz-crisp-edges !important;
      image-rendering: -webkit-crisp-edges !important;
      image-rendering: pixelated !important;
      image-rendering: crisp-edges !important;
    }

    #game .ejs_virtual_gamepad,
    #game .ejs_menu,
    #game .ejs_start_screen,
    #game [id*="controls_menu"] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #waiting-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #09090b;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fafafa;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .logger-wrapper {
      position: relative;
      margin: 6px 4px;
    }

    #screen-logger {
      height: 75px;
      background: rgba(10, 10, 14, 0.92);
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 10px;
      line-height: 1.35;
      color: #22c55e;
      overflow-y: auto;
      word-break: break-all;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
      z-index: 50;
      touch-action: pan-y !important;
      -webkit-user-select: text !important;
      user-select: text !important;
      cursor: text;
    }

    #screen-logger * {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    .copy-log-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #27272a;
      border: 1px solid #52525b;
      color: #fafafa;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.8;
      z-index: 60;
    }

    .copy-log-btn:active {
      background: #38bdf8;
      color: #000;
    }

    .log-err { color: #ef4444; font-weight: bold; }
    .log-warn { color: #facc15; }
    .log-info { color: #38bdf8; }

    .controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 4px 10px;
    }

    .main-pads {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 2px;
    }

    .dpad {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .dpad-btn {
      position: absolute;
      background: #1c1c22;
      border: 2px solid #0f0f13;
      box-shadow: 0 4px 0 #09090b;
      border-radius: 6px;
      cursor: pointer;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      box-shadow: 0 1px 0 #09090b;
      transform: translateY(3px);
      background: #2b2b35;
    }

    .dpad-up { top: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-down { bottom: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-left { top: 45px; left: 0; width: 45px; height: 40px; }
    .dpad-right { top: 45px; right: 0; width: 45px; height: 40px; }
    .dpad-center {
      position: absolute;
      top: 45px;
      left: 45px;
      width: 40px;
      height: 40px;
      background: #1c1c22;
    }

    .action-buttons {
      display: flex;
      gap: 14px;
      transform: rotate(-25deg);
      margin-right: 2px;
    }

    .action-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dc2626;
      border: 2px solid #7f1d1d;
      box-shadow: 0 5px 0 #500724;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .action-btn:active, .action-btn.pressed {
      box-shadow: 0 1px 0 #500724;
      transform: translateY(4px);
      background: #ef4444;
    }

    .system-pads {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 4px;
    }

    .sys-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .sys-btn {
      width: 48px;
      height: 14px;
      background: #52525b;
      border: 1px solid #27272a;
      border-radius: 8px;
      transform: rotate(-25deg);
      box-shadow: 0 2px 0 #18181b;
      cursor: pointer;
    }

    .sys-btn:active, .sys-btn.pressed {
      box-shadow: none;
      transform: rotate(-25deg) translateY(2px);
    }

    .sys-label {
      font-size: 10px;
      color: #a1a1aa;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="console">
    <div class="screen-bezel">
      <div id="game-container">
        <div id="game"></div>
        <div id="waiting-overlay">
          <div class="spinner"></div>
          <div style="font-weight: 700; font-size: 14px; margin-bottom: 6px;">ПІДКЛЮЧЕННЯ ДО ХОСТА...</div>
          <div style="color: #71717a; font-size: 11px;">Ініціалізація хмарного потоку...</div>
        </div>
      </div>
      <div class="brand">DENDYGRAM • CLOUD</div>
    </div>

    <div class="logger-wrapper">
      <div id="screen-logger"></div>
      <button class="copy-log-btn" id="copy-btn">COPY</button>
    </div>

    <div class="controls">
      <div class="main-pads">
        <div class="dpad">
          <div class="dpad-center"></div>
          <div class="dpad-btn dpad-up" data-btn="4"></div>
          <div class="dpad-btn dpad-down" data-btn="5"></div>
          <div class="dpad-btn dpad-left" data-btn="6"></div>
          <div class="dpad-btn dpad-right" data-btn="7"></div>
        </div>

        <div class="action-buttons">
          <div class="action-btn" data-btn="0">B</div>
          <div class="action-btn" data-btn="8">A</div>
        </div>
      </div>

      <div class="system-pads">
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="2"></div>
          <span class="sys-label">SELECT</span>
        </div>
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="3"></div>
          <span class="sys-label">START</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const loggerEl = document.getElementById('screen-logger');
    const copyBtn = document.getElementById('copy-btn');

    function logScreen(msg, type = 'normal') {
      if (!loggerEl) return;
      const d = document.createElement('div');
      const time = new Date().toTimeString().split(' ')[0].substring(3);
      d.textContent = `[${time}] ${msg}`;
      if (type === 'err') d.className = 'log-err';
      else if (type === 'warn') d.className = 'log-warn';
      else if (type === 'info') d.className = 'log-info';
      loggerEl.appendChild(d);
      loggerEl.scrollTop = loggerEl.scrollHeight;
    }

    if (copyBtn) {
      copyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(loggerEl.innerText).then(() => {
          logScreen("Логи скопійовано!", "info");
        });
      });
    }

    window.onerror = function(msg, url, line) {
      logScreen(`CRASH: ${msg} (L:${line})`, 'err');
      return false;
    };

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    function decodeBase64Url(str) {
      if (!str) return '';
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      try { return decodeURIComponent(escape(atob(str))); } catch (e) { return atob(str); }
    }

    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const urlParams = new URLSearchParams(window.location.search);

    let appData = {};
    const rawApp = hashParams.get('app');
    if (rawApp) {
      try { appData = JSON.parse(decodeBase64Url(rawApp)); } catch (e) {}
    }

    let targetRom = appData.rom || hashParams.get('rom') || urlParams.get('rom') || urlParams.get('startapp') || tg?.initDataUnsafe?.start_param;
    const roomId = appData.room || hashParams.get('room') || urlParams.get('room');
    const rawP = appData.p || hashParams.get('player') || hashParams.get('p') || urlParams.get('player') || urlParams.get('p');
    const isGuest = (rawP == 2 || rawP === '2');

    if (!targetRom) {
      targetRom = "https://cdn.emulatorjs.org/stable/data/roms/nes/Super%20Mario%20Bros%20(Japan,%20USA).nes";
    }

    const brandElem = document.querySelector('.brand');
    function setBrandStatus(text, color) {
      if (!brandElem) return;
      brandElem.textContent = text;
      if (color) brandElem.style.color = color;
    }

    const gameContainer = document.getElementById('game-container');
    const waitingOverlay = document.getElementById('waiting-overlay');

    // ==========================================
    // ВІРТУАЛЬНИЙ GAMEPAD API ДЛЯ RETROARCH P2
    // ==========================================
    window.__p2Gamepad = {
      id: "DendyGram Virtual Controller",
      index: 1,
      connected: true,
      timestamp: performance.now(),
      mapping: "standard",
      axes: [0, 0, 0, 0],
      buttons: Array.from({ length: 16 }, () => ({ pressed: false, value: 0 }))
    };

    const origGetGamepads = navigator.getGamepads ? navigator.getGamepads.bind(navigator) : null;
    navigator.getGamepads = function() {
      const pads = origGetGamepads ? Array.from(origGetGamepads()) : [null, null];
      pads[1] = window.__p2Gamepad;
      return pads;
    };

    // Стандартні індекси кнопок W3C Gamepad:
    const nesToGamepadIndex = {
      0: 0,   // B
      8: 1,   // A
      2: 8,   // SELECT
      3: 9,   // START
      4: 12,  // UP
      5: 13,  // DOWN
      6: 14,  // LEFT
      7: 15   // RIGHT
    };

    function sendEjsInput(port, btnId, val) {
      const emu = window.EJS_emulator;
      const isDown = val === 1;

      if (port === 1) {
        // Оновлюємо віртуальний Gamepad 2
        const padIdx = nesToGamepadIndex[btnId];
        if (padIdx !== undefined && window.__p2Gamepad) {
          window.__p2Gamepad.buttons[padIdx].pressed = isDown;
          window.__p2Gamepad.buttons[padIdx].value = isDown ? 1.0 : 0.0;
          window.__p2Gamepad.timestamp = performance.now();
        }

        // Паралельно викликаємо внутрішні методи ядра
        try {
          if (emu?.controls?.simulateButton) emu.controls.simulateButton(1, btnId, val);
          if (emu?.gameManager?.setInputValue) emu.gameManager.setInputValue(1, btnId, val);
        } catch(e) {}
        return true;
      }

      // Для P1 — емулюємо системні клавіші
      const evType = isDown ? 'keydown' : 'keyup';
      const canvas = document.querySelector('#game canvas');
      function fireKey(k, c, codeNum) {
        const ev = new KeyboardEvent(evType, {
          key: k, code: c, keyCode: codeNum, which: codeNum,
          bubbles: true, cancelable: true, view: window
        });
        if (canvas) canvas.dispatchEvent(ev);
        window.dispatchEvent(ev);
      }

      if (btnId === 2) {
        fireKey('Shift', 'ShiftLeft', 16);
        fireKey('v', 'KeyV', 86);
      } else if (btnId === 3) fireKey('Enter', 'Enter', 13);
      else if (btnId === 0) fireKey('z', 'KeyZ', 90);
      else if (btnId === 8) fireKey('x', 'KeyX', 88);
      else if (btnId === 4) fireKey('ArrowUp', 'ArrowUp', 38);
      else if (btnId === 5) fireKey('ArrowDown', 'ArrowDown', 40);
      else if (btnId === 6) fireKey('ArrowLeft', 'ArrowLeft', 37);
      else if (btnId === 7) fireKey('ArrowRight', 'ArrowRight', 39);

      try {
        if (emu?.controls?.simulateButton) emu.controls.simulateButton(0, btnId, val);
      } catch(e) {}
      return true;
    }

    // ==========================================
    // ПЕРЕХОПЛЕННЯ АУДІО ДЛЯ СТРІМУ
    // ==========================================
    let hostAudioTrack = null;
    const OrigAudioCtx = window.AudioContext || window.webkitAudioContext;
    if (OrigAudioCtx) {
      window.AudioContext = window.webkitAudioContext = function() {
        const ctx = new OrigAudioCtx();
        try {
          const dest = ctx.createMediaStreamDestination();
          ctx.destination.connect(dest);
          if (dest.stream.getAudioTracks().length > 0) {
            hostAudioTrack = dest.stream.getAudioTracks()[0];
          }
        } catch(e) {}
        return ctx;
      };
    }

    // ==========================================
    // P2P КОНФІГУРАЦІЯ
    // ==========================================
    const meteredIceServers = [
      { urls: "stun:stun.relay.metered.ca:80" },
      { urls: "turn:global.relay.metered.ca:80", username: "d7695a22150cfea32f5b287e", credential: "Jm8+83G3JIEbY+Dj" },
      { urls: "turn:global.relay.metered.ca:443", username: "d7695a22150cfea32f5b287e", credential: "Jm8+83G3JIEbY+Dj" }
    ];

    const peerConfig = {
      config: {
        iceServers: meteredIceServers,
        sdpSemantics: 'unified-plan'
      }
    };

    let peer = null;
    let dataConn = null;
    const hostPeerId = `dendygram_cloud_${roomId}`;

    if (roomId && isGuest) {
      // ==========================================
      // КЛІЄНТ (P2) - ХМАРНИЙ РЕНДЕР БЕЗ ЕМУЛЯТОРА
      // ==========================================
      setBrandStatus("DENDYGRAM • CLOUD GUEST", "#34d399");
      waitingOverlay.style.display = 'flex';

      const localGame = document.getElementById('game');
      if (localGame) localGame.remove();

      const video = document.createElement('video');
      video.id = 'cloud-video';
      video.autoplay = true;
      video.playsInline = true;
      video.muted = false; // Звук грає нативно
      gameContainer.appendChild(video);

      video.addEventListener('playing', () => {
        waitingOverlay.style.display = 'none';
        setBrandStatus("DENDYGRAM • 60 FPS LIVE", "#22c55e");
        logScreen("Хмарний стрім активний!", "info");
      });

      peer = new Peer(peerConfig);
      peer.on('open', (id) => {
        logScreen(`P2 зареєстровано: ${id.substring(0, 8)}...`);
        dataConn = peer.connect(hostPeerId, { reliable: true });

        dataConn.on('open', () => {
          logScreen("Канал керування підключено!", "info");
        });
        dataConn.on('error', (e) => logScreen(`DataConn err: ${e}`, 'err'));
      });

      peer.on('call', (call) => {
        logScreen("Отримано медіапотік гри від хоста!", "info");
        call.answer();
        call.on('stream', (remoteStream) => {
          video.srcObject = remoteStream;
          video.play().catch(e => {
            logScreen("Autoplay блоковано. Торкнись екрана!", "warn");
            document.body.addEventListener('touchstart', () => video.play(), { once: true });
          });
        });
      });

      peer.on('error', (err) => logScreen(`Peer err: ${err.type}`, "err"));

    } else {
      // ==========================================
      // ХОСТ (P1) - ЕМУЛЯТОР + ХМАРНИЙ СЕРВЕР
      // ==========================================
      setBrandStatus(roomId ? "DENDYGRAM • HOSTING" : "DENDYGRAM • SOLO", "#38bdf8");

      let cleanRom = targetRom;
      try {
        if (!cleanRom.startsWith('http')) cleanRom = decodeBase64Url(cleanRom);
        else cleanRom = decodeURIComponent(cleanRom);
      } catch (e) {}

      window.EJS_player = '#game';
      window.EJS_core = 'nes';
      window.EJS_gameUrl = cleanRom;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_alignStartButton = false;
      window.EJS_disableToolbar = true;
      window.EJS_VirtualGamepadSettings = [0, 0];
      window.EJS_mouse = false;
      window.EJS_defaultPlayers = 2;

      logScreen("Завантажуємо емулятор...", "info");
      const loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      loader.async = true;
      document.head.appendChild(loader);

      if (roomId) {
        peer = new Peer(hostPeerId, peerConfig);

        peer.on('open', () => {
          logScreen("Хост очікує підключення другого гравця...");
        });

        peer.on('connection', (c) => {
          dataConn = c;
          setBrandStatus("DENDYGRAM • P2 ONLINE!", "#22c55e");
          logScreen("Гравець 2 підключився! Запуск стріму...", "info");

          c.on('data', (d) => {
            if (d.t === 'INP') {
              sendEjsInput(1, d.b, d.v);
              logScreen(`P2 TAP -> btn=${d.b} val=${d.v}`);
            }
          });

          startCloudStream(c.peer);
        });

        peer.on('error', (err) => logScreen(`Peer хоста: ${err.type}`, "err"));
      }
    }

    // Запуск захоплення полотна та аудіо з бітрейт-тюнінгом
    function startCloudStream(guestId) {
      let attempts = 0;
      const streamTimer = setInterval(() => {
        attempts++;
        const canvas = document.querySelector('#game canvas');
        if (canvas && canvas.width > 100 && window.EJS_emulator) {
          clearInterval(streamTimer);
          logScreen(`Канвас готовий (${canvas.width}x${canvas.height}). Формуємо потік...`, "info");

          try {
            // Захоплення 60 FPS прямо з канвасу NES
            const videoStream = canvas.captureStream(60);
            const vTrack = videoStream.getVideoTracks()[0];
            if (vTrack && 'contentHint' in vTrack) {
              vTrack.contentHint = 'detail'; // Зберігає піксельну чіткість без згладжування
            }

            const combinedStream = new MediaStream();
            if (vTrack) combinedStream.addTrack(vTrack);
            if (hostAudioTrack) combinedStream.addTrack(hostAudioTrack);

            const call = peer.call(guestId, combinedStream);

            if (call && call.peerConnection) {
              call.peerConnection.addEventListener('negotiationneeded', async () => {
                try {
                  const senders = call.peerConnection.getSenders();
                  const videoSender = senders.find(s => s.track && s.track.kind === 'video');
                  if (videoSender) {
                    const params = videoSender.getParameters();
                    if (!params.encodings) params.encodings = [{}];
                    // 2.0 Мбіт/с з головою вистачає для 256x240 на 60 FPS
                    params.encodings[0].maxBitrate = 2000000;
                    params.encodings[0].maxFramerate = 60;
                    await videoSender.setParameters(params);
                  }
                } catch(e) {}
              });
            }

            logScreen("Хмарний стрім надіслано гостю!", "info");
          } catch(err) {
            logScreen(`Помилка стріму: ${err.message}`, "err");
          }
        }

        if (attempts > 50) {
          clearInterval(streamTimer);
          logScreen("Таймаут захоплення канвасу", "warn");
        }
      }, 300);
    }

    // ==========================================
    // ОБРОБКА ГЕЙМПАДУ
    // ==========================================
    function handleButtonAction(btnId, isDown) {
      const val = isDown ? 1 : 0;

      if (isGuest) {
        // P2 надсилає інпут через надійний DataChannel
        if (dataConn && dataConn.open) {
          dataConn.send({ t: 'INP', b: btnId, v: val });
          logScreen(`P2 тап: btn=${btnId} val=${val}`);
        } else {
          logScreen("Зв'язок не готовий", "warn");
        }
      } else {
        // P1 керує локально
        sendEjsInput(0, btnId, val);
        logScreen(`P1 тап: btn=${btnId} val=${val}`);
      }
    }

    document.querySelectorAll('[data-btn]').forEach(elem => {
      const btnId = parseInt(elem.getAttribute('data-btn'), 10);

      const down = (e) => {
        e.preventDefault();
        elem.classList.add('pressed');
        handleButtonAction(btnId, true);
      };

      const up = (e) => {
        e.preventDefault();
        elem.classList.remove('pressed');
        handleButtonAction(btnId, false);
      };

      elem.addEventListener('pointerdown', down);
      elem.addEventListener('pointerup', up);
      elem.addEventListener('pointercancel', up);
      elem.addEventListener('pointerleave', up);
    });
  </script>
</body>
</html>

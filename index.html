<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DendyGram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      background: #121214;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }

    .console {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 820px;
      background: #272730;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 2px 3px rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      padding: 12px 8px; /* Зменшили бічні відступи корпусу */
      touch-action: none;
    }

    .screen-bezel {
      background: #111113;
      border-radius: 16px;
      padding: 8px 8px 6px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 4px;
    }

    .brand {
      color: #71717a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 6px;
    }

    #game-container {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    #game {
      width: 100% !important;
      height: 100% !important;
    }

    .controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 4px 10px;
    }

    /* Рядок кнопок керування розтягнутий впритул до боків */
    .main-pads {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 2px;
    }

    /* Хрестовина D-Pad впритул до лівого краю */
    .dpad {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .dpad-btn {
      position: absolute;
      background: #1c1c22;
      border: 2px solid #0f0f13;
      box-shadow: 0 4px 0 #09090b;
      border-radius: 6px;
      cursor: pointer;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      box-shadow: 0 1px 0 #09090b;
      transform: translateY(3px);
      background: #2b2b35;
    }

    .dpad-up { top: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-down { bottom: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-left { top: 45px; left: 0; width: 45px; height: 40px; }
    .dpad-right { top: 45px; right: 0; width: 45px; height: 40px; }
    .dpad-center {
      position: absolute;
      top: 45px;
      left: 45px;
      width: 40px;
      height: 40px;
      background: #1c1c22;
    }

    /* Кнопки B / A впритул до правого краю */
    .action-buttons {
      display: flex;
      gap: 14px;
      transform: rotate(-25deg);
      margin-right: 2px;
    }

    .action-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dc2626;
      border: 2px solid #7f1d1d;
      box-shadow: 0 5px 0 #500724;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .action-btn:active, .action-btn.pressed {
      box-shadow: 0 1px 0 #500724;
      transform: translateY(4px);
      background: #ef4444;
    }

    /* Системні кнопки опущені нижче і підписи відсунуті */
    .system-pads {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 8px;
    }

    .sys-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px; /* Збільшили відступ між кнопкою і текстом */
    }

    .sys-btn {
      width: 48px;
      height: 14px;
      background: #52525b;
      border: 1px solid #27272a;
      border-radius: 8px;
      transform: rotate(-25deg);
      box-shadow: 0 2px 0 #18181b;
      cursor: pointer;
    }

    .sys-btn:active, .sys-btn.pressed {
      box-shadow: none;
      transform: rotate(-25deg) translateY(2px);
    }

    .sys-label {
      font-size: 10px;
      color: #a1a1aa;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="console">
    <div class="screen-bezel">
      <div id="game-container">
        <div id="game"></div>
      </div>
      <div class="brand">DENDYGRAM • PORTABLE</div>
    </div>

    <div class="controls">
      <div class="main-pads">
        <div class="dpad">
          <div class="dpad-center"></div>
          <div class="dpad-btn dpad-up" data-key="ArrowUp"></div>
          <div class="dpad-btn dpad-down" data-key="ArrowDown"></div>
          <div class="dpad-btn dpad-left" data-key="ArrowLeft"></div>
          <div class="dpad-btn dpad-right" data-key="ArrowRight"></div>
        </div>

        <div class="action-buttons">
          <div class="action-btn" data-key="KeyZ">B</div>
          <div class="action-btn" data-key="KeyX">A</div>
        </div>
      </div>

      <div class="system-pads">
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-key="ShiftLeft"></div>
          <span class="sys-label">SELECT</span>
        </div>
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-key="Enter"></div>
          <span class="sys-label">START</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    function decodeBase64Url(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return decodeURIComponent(escape(atob(str)));
    }

    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const urlParams = new URLSearchParams(window.location.search);
    let targetRom = hashParams.get('rom') || urlParams.get('rom') || urlParams.get('startapp') || tg?.initDataUnsafe?.start_param;

    if (targetRom) {
      try {
        if (!targetRom.startsWith('http')) {
          targetRom = decodeBase64Url(targetRom);
        } else {
          targetRom = decodeURIComponent(targetRom);
        }
      } catch (e) {
        console.error("Помилка декодування:", e);
      }

      window.EJS_player = '#game';
      window.EJS_core = 'nes';
      window.EJS_gameUrl = targetRom;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_alignStartButton = false;
      window.EJS_disableToolbar = true;

      const loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(loader);
    }

    // Блок емуляції кнопок
    const keyMap = {
      ArrowUp:    { key: 'ArrowUp',    code: 'ArrowUp',    keyCode: 38 },
      ArrowDown:  { key: 'ArrowDown',  code: 'ArrowDown',  keyCode: 40 },
      ArrowLeft:  { key: 'ArrowLeft',  code: 'ArrowLeft',  keyCode: 37 },
      ArrowRight: { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 },
      KeyX:       { key: 'x',          code: 'KeyX',       keyCode: 88 },
      KeyZ:       { key: 'z',          code: 'KeyZ',       keyCode: 90 },
      Enter:      { key: 'Enter',      code: 'Enter',      keyCode: 13 },
      ShiftLeft:  { key: 'Shift',      code: 'ShiftLeft',  keyCode: 16 }
    };

    const ejsBtnMap = {
      KeyZ: 0,
      KeyX: 8,
      ShiftLeft: 2,
      Enter: 3,
      ArrowUp: 4,
      ArrowDown: 5,
      ArrowLeft: 6,
      ArrowRight: 7
    };

    function triggerKey(code, type) {
      const isDown = (type === 'keydown');

      try {
        if (window.EJS_emulator?.controls?.simulateButton) {
          const btnId = ejsBtnMap[code];
          if (btnId !== undefined) {
            window.EJS_emulator.controls.simulateButton(0, btnId, isDown ? 1 : 0);
            return;
          }
        }
      } catch (err) {}

      const meta = keyMap[code];
      if (!meta) return;

      const ev = new KeyboardEvent(type, {
        key: meta.key,
        code: meta.code,
        keyCode: meta.keyCode,
        which: meta.keyCode,
        bubbles: true,
        cancelable: true,
        composed: true,
        view: window
      });
      Object.defineProperty(ev, 'keyCode', { get: () => meta.keyCode });
      Object.defineProperty(ev, 'which', { get: () => meta.keyCode });

      const targets = [
        document.querySelector('#game canvas'),
        document.querySelector('canvas'),
        document.getElementById('game'),
        window,
        document
      ];

      for (const target of targets) {
        if (target) {
          if (typeof target.focus === 'function') target.focus();
          target.dispatchEvent(ev);
        }
      }
    }

    document.querySelectorAll('[data-key]').forEach(elem => {
      const code = elem.getAttribute('data-key');

      const handlePress = (e) => {
        e.preventDefault();
        elem.classList.add('pressed');
        if (tg?.HapticFeedback) {
          tg.HapticFeedback.impactOccurred('medium');
        } else if (navigator.vibrate) {
          navigator.vibrate(12);
        }
        triggerKey(code, 'keydown');
      };

      const handleRelease = (e) => {
        e.preventDefault();
        elem.classList.remove('pressed');
        triggerKey(code, 'keyup');
      };

      elem.addEventListener('pointerdown', handlePress);
      elem.addEventListener('pointerup', handleRelease);
      elem.addEventListener('pointercancel', handleRelease);
      elem.addEventListener('pointerleave', handleRelease);
    });
  </script>
</body>
</html>

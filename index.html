<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DendyGram Real Cloud 60FPS</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      margin: 0;
      background: #121214;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }

    .console {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 820px;
      background: #272730;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 2px 3px rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      padding: 12px 8px;
      touch-action: none;
      position: relative;
    }

    .screen-bezel {
      background: #111113;
      border-radius: 16px;
      padding: 8px 8px 6px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 4px;
    }

    .brand {
      color: #71717a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 6px;
      transition: color 0.3s ease;
      text-transform: uppercase;
    }

    #game-container {
      width: 100%;
      height: 240px;
      min-height: 240px;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    #game, #cloud-video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      background: #000;
    }

    #cloud-video {
      display: none;
      image-rendering: pixelated !important;
    }

    #game canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      image-rendering: pixelated !important;
    }

    #game .ejs_virtual_gamepad,
    #game .ejs_menu,
    #game .ejs_start_screen,
    #game [id*="controls_menu"] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #waiting-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #09090b;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fafafa;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #play-trigger-btn {
      display: none;
      margin-top: 14px;
      background: #22c55e;
      color: #052e16;
      border: none;
      font-weight: 800;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
      cursor: pointer;
    }

    #play-trigger-btn:active {
      transform: scale(0.96);
      background: #16a34a;
    }

    .logger-wrapper {
      position: relative;
      margin: 6px 4px;
    }

    #screen-logger {
      height: 75px;
      background: rgba(10, 10, 14, 0.92);
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 10px;
      line-height: 1.35;
      color: #22c55e;
      overflow-y: auto;
      word-break: break-all;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
      z-index: 50;
      touch-action: pan-y !important;
      -webkit-user-select: text !important;
      user-select: text !important;
      cursor: text;
    }

    #screen-logger * {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    .copy-log-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #27272a;
      border: 1px solid #52525b;
      color: #fafafa;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.8;
      z-index: 60;
    }

    .copy-log-btn:active {
      background: #38bdf8;
      color: #000;
    }

    .log-err { color: #ef4444; font-weight: bold; }
    .log-warn { color: #facc15; }
    .log-info { color: #38bdf8; }

    .controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 4px 10px;
    }

    .main-pads {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 2px;
    }

    .dpad {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .dpad-btn {
      position: absolute;
      background: #1c1c22;
      border: 2px solid #0f0f13;
      box-shadow: 0 4px 0 #09090b;
      border-radius: 6px;
      cursor: pointer;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      box-shadow: 0 1px 0 #09090b;
      transform: translateY(3px);
      background: #2b2b35;
    }

    .dpad-up { top: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-down { bottom: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-left { top: 45px; left: 0; width: 45px; height: 40px; }
    .dpad-right { top: 45px; right: 0; width: 45px; height: 40px; }
    .dpad-center {
      position: absolute;
      top: 45px;
      left: 45px;
      width: 40px;
      height: 40px;
      background: #1c1c22;
    }

    .action-buttons {
      display: flex;
      gap: 14px;
      transform: rotate(-25deg);
      margin-right: 2px;
    }

    .action-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dc2626;
      border: 2px solid #7f1d1d;
      box-shadow: 0 5px 0 #500724;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .action-btn:active, .action-btn.pressed {
      box-shadow: 0 1px 0 #500724;
      transform: translateY(4px);
      background: #ef4444;
    }

    .system-pads {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 4px;
    }

    .sys-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .sys-btn {
      width: 48px;
      height: 14px;
      background: #52525b;
      border: 1px solid #27272a;
      border-radius: 8px;
      transform: rotate(-25deg);
      box-shadow: 0 2px 0 #18181b;
      cursor: pointer;
    }

    .sys-btn:active, .sys-btn.pressed {
      box-shadow: none;
      transform: rotate(-25deg) translateY(2px);
    }

    .sys-label {
      font-size: 10px;
      color: #a1a1aa;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="console">
    <div class="screen-bezel">
      <div id="game-container">
        <div id="game"></div>
        <video id="cloud-video" autoplay playsinline muted></video>
        <div id="waiting-overlay">
          <div class="spinner"></div>
          <div id="overlay-msg" style="font-weight: 700; font-size: 14px; margin-bottom: 6px;">ПІДКЛЮЧЕННЯ...</div>
          <div id="overlay-sub" style="color: #71717a; font-size: 11px;">Ініціалізація низьколатентного стріму...</div>
          <button id="play-trigger-btn">▶ УВІЙТИ В ГРУ</button>
        </div>
      </div>
      <div class="brand">DENDYGRAM • LOW-LATENCY CLOUD</div>
    </div>

    <div class="logger-wrapper">
      <div id="screen-logger"></div>
      <button class="copy-log-btn" id="copy-btn">COPY</button>
    </div>

    <div class="controls">
      <div class="main-pads">
        <div class="dpad">
          <div class="dpad-center"></div>
          <div class="dpad-btn dpad-up" data-btn="4"></div>
          <div class="dpad-btn dpad-down" data-btn="5"></div>
          <div class="dpad-btn dpad-left" data-btn="6"></div>
          <div class="dpad-btn dpad-right" data-btn="7"></div>
        </div>

        <div class="action-buttons">
          <div class="action-btn" data-btn="0">B</div>
          <div class="action-btn" data-btn="8">A</div>
        </div>
      </div>

      <div class="system-pads">
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="2"></div>
          <span class="sys-label">SELECT</span>
        </div>
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="3"></div>
          <span class="sys-label">START</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const loggerEl = document.getElementById('screen-logger');
    const copyBtn = document.getElementById('copy-btn');

    function logScreen(msg, type = 'normal') {
      if (!loggerEl) return;
      const d = document.createElement('div');
      const time = new Date().toTimeString().split(' ')[0].substring(3);
      d.textContent = `[${time}] ${msg}`;
      if (type === 'err') d.className = 'log-err';
      else if (type === 'warn') d.className = 'log-warn';
      else if (type === 'info') d.className = 'log-info';
      loggerEl.appendChild(d);
      loggerEl.scrollTop = loggerEl.scrollHeight;
    }

    if (copyBtn) {
      copyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(loggerEl.innerText).then(() => {
          logScreen("Логи скопійовано!", "info");
        });
      });
    }

    window.onerror = function(msg, url, line) {
      logScreen(`CRASH: ${msg} (L:${line})`, 'err');
      return false;
    };

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    function decodeBase64Url(str) {
      if (!str) return '';
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      try { return decodeURIComponent(escape(atob(str))); } catch (e) { return atob(str); }
    }

    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const urlParams = new URLSearchParams(window.location.search);

    let appData = {};
    const rawApp = hashParams.get('app');
    if (rawApp) {
      try { appData = JSON.parse(decodeBase64Url(rawApp)); } catch (e) {}
    }

    let targetRom = appData.rom || hashParams.get('rom') || urlParams.get('rom') || urlParams.get('startapp') || tg?.initDataUnsafe?.start_param;
    const roomId = appData.room || hashParams.get('room') || urlParams.get('room');
    const rawP = appData.p || hashParams.get('player') || hashParams.get('p') || urlParams.get('player') || urlParams.get('p');
    const isGuest = (rawP == 2 || rawP === '2');

    if (!targetRom) {
      targetRom = "https://cdn.emulatorjs.org/stable/data/roms/nes/Super%20Mario%20Bros%20(Japan,%20USA).nes";
    }

    const brandElem = document.querySelector('.brand');
    function setBrandStatus(text, color) {
      if (!brandElem) return;
      brandElem.textContent = text;
      if (color) brandElem.style.color = color;
    }

    const gameDiv = document.getElementById('game');
    const cloudVideo = document.getElementById('cloud-video');
    const waitingOverlay = document.getElementById('waiting-overlay');
    const playTriggerBtn = document.getElementById('play-trigger-btn');
    const overlayMsg = document.getElementById('overlay-msg');
    const overlaySub = document.getElementById('overlay-sub');

    // ==========================================
    // ВІРТУАЛЬНІ GAMEPAD ДЛЯ RETROARCH
    // ==========================================
    window.__virtualPads = [
      { id: "P1 Controller", index: 0, connected: true, timestamp: performance.now(), mapping: "standard", axes: [0, 0], buttons: Array.from({ length: 16 }, () => ({ pressed: false, value: 0 })) },
      { id: "P2 Controller", index: 1, connected: true, timestamp: performance.now(), mapping: "standard", axes: [0, 0], buttons: Array.from({ length: 16 }, () => ({ pressed: false, value: 0 })) }
    ];

    navigator.getGamepads = function() {
      return window.__virtualPads;
    };

    const nesToPad = { 0: 0, 8: 1, 2: 8, 3: 9, 4: 12, 5: 13, 6: 14, 7: 15 };
    const hostKeyMap = {
      0: { key: 'z', code: 'KeyZ', keyCode: 90 },
      8: { key: 'x', code: 'KeyX', keyCode: 88 },
      2: { key: 'Shift', code: 'ShiftLeft', keyCode: 16 },
      3: { key: 'Enter', code: 'Enter', keyCode: 13 },
      4: { key: 'ArrowUp', code: 'ArrowUp', keyCode: 38 },
      5: { key: 'ArrowDown', code: 'ArrowDown', keyCode: 40 },
      6: { key: 'ArrowLeft', code: 'ArrowLeft', keyCode: 37 },
      7: { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 }
    };

    function sendEjsInput(port, btnId, val) {
      const isDown = (val === 1);
      const emu = window.EJS_emulator;

      const padIdx = nesToPad[btnId];
      if (padIdx !== undefined && window.__virtualPads[port]) {
        window.__virtualPads[port].buttons[padIdx].pressed = isDown;
        window.__virtualPads[port].buttons[padIdx].value = isDown ? 1.0 : 0.0;
        window.__virtualPads[port].timestamp = performance.now();
      }

      try {
        if (emu?.gameManager?.simulateInput) {
          emu.gameManager.simulateInput(port, btnId, val);
        }
      } catch(e) {}

      if (port === 0) {
        const k = hostKeyMap[btnId];
        if (k) {
          const evType = isDown ? 'keydown' : 'keyup';
          const canvas = document.querySelector('#game canvas');
          function fire(keyStr, codeStr, codeNum) {
            const ev = new KeyboardEvent(evType, {
              key: keyStr, code: codeStr, keyCode: codeNum, which: codeNum,
              bubbles: true, cancelable: true, view: window
            });
            window.dispatchEvent(ev);
            document.dispatchEvent(ev);
            if (canvas) canvas.dispatchEvent(ev);
          }
          fire(k.key, k.code, k.keyCode);
          if (btnId === 2) {
            fire('Shift', 'ShiftLeft', 16);
            fire('v', 'KeyV', 86);
          }
        }
      }
    }

    // ==========================================
    // LOW-LATENCY SDP HACK (H.264 Baseline, 0 B-frames)
    // ==========================================
    function optimizeSdp(sdp) {
      return sdp.replace(/a=fmtp:(\d+) (.*)/g, (match, pt, params) => {
        // Додаємо прапорці нульової затримки для відео
        return `${match};x-google-min-bitrate=1000;x-google-max-bitrate=2000;packetization-mode=1`;
      });
    }

    const meteredIceServers = [
      { urls: "stun:stun.relay.metered.ca:80" },
      { urls: "turn:global.relay.metered.ca:80", username: "d7695a22150cfea32f5b287e", credential: "Jm8+83G3JIEbY+Dj" },
      { urls: "turn:global.relay.metered.ca:443", username: "d7695a22150cfea32f5b287e", credential: "Jm8+83G3JIEbY+Dj" }
    ];

    const peerConfig = {
      config: {
        iceServers: meteredIceServers,
        sdpSemantics: 'unified-plan'
      }
    };

    let peer = null;
    let dataConn = null;
    const hostPeerId = `dendygram_fast_${roomId}`;

    if (roomId && isGuest) {
      // === P2 GUEST ===
      setBrandStatus("DENDYGRAM • P2 GUEST", "#34d399");
      gameDiv.style.display = 'none';
      cloudVideo.style.display = 'block';
      waitingOverlay.style.display = 'flex';

      function unlockAudioVideo() {
        cloudVideo.muted = false;
        cloudVideo.play().then(() => {
          waitingOverlay.style.display = 'none';
          setBrandStatus("DENDYGRAM • LOW-LATENCY 60FPS", "#22c55e");
          logScreen("Потік розблоковано!", "info");
        }).catch(e => logScreen(`Play err: ${e.message}`, "err"));
      }
      playTriggerBtn.addEventListener('click', unlockAudioVideo);

      peer = new Peer(peerConfig);
      peer.on('open', (id) => {
        logScreen(`P2 зареєстровано: ${id.substring(0, 6)}`);
        dataConn = peer.connect(hostPeerId, { reliable: true });

        dataConn.on('open', () => {
          logScreen("Канал керування підключено!", "info");
        });
        dataConn.on('error', (e) => logScreen(`DataConn err: ${e}`, 'err'));
      });

      peer.on('call', (call) => {
        logScreen("З'єднання дзвінка...", "info");
        call.answer();

        if (call.peerConnection) {
          call.peerConnection.ontrack = (event) => {
            if (event.receiver) {
              try {
                if ('playoutDelayHint' in event.receiver) event.receiver.playoutDelayHint = 0;
                if ('jitterBufferTarget' in event.receiver) event.receiver.jitterBufferTarget = 0;
              } catch(e) {}
            }
            cloudVideo.srcObject = event.streams[0];
          };
        }

        call.on('stream', (remoteStream) => {
          cloudVideo.srcObject = remoteStream;
          cloudVideo.play().then(() => {
            waitingOverlay.style.display = 'none';
            setBrandStatus("DENDYGRAM • LOW-LATENCY 60FPS", "#22c55e");
            logScreen("Стрім активний з нульовим буфером!", "info");
          }).catch(() => {
            const spinner = document.querySelector('.spinner');
            if (spinner) spinner.style.display = 'none';
            overlayMsg.textContent = "ПОТІК ПРИЙНЯТО!";
            overlaySub.textContent = "Торкнись для миттєвого старту";
            playTriggerBtn.style.display = 'block';
          });
        });
      });

      peer.on('error', (err) => logScreen(`Peer P2 err: ${err.type}`, "err"));

    } else {
      // === P1 HOST ===
      setBrandStatus(roomId ? "DENDYGRAM • HOSTING" : "DENDYGRAM • SOLO", "#38bdf8");

      let cleanRom = targetRom;
      try {
        if (!cleanRom.startsWith('http')) cleanRom = decodeBase64Url(cleanRom);
        else cleanRom = decodeURIComponent(cleanRom);
      } catch (e) {}

      window.EJS_player = '#game';
      window.EJS_core = 'nes';
      window.EJS_gameUrl = cleanRom;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_alignStartButton = false;
      window.EJS_disableToolbar = true;
      window.EJS_VirtualGamepadSettings = [0, 0];
      window.EJS_mouse = false;

      logScreen("Завантажуємо loader.js...", "info");
      const loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      loader.async = true;
      loader.onload = () => logScreen("loader.js завантажено успішно!");
      loader.onerror = () => logScreen("Помилка завантаження CDN!", "err");
      document.head.appendChild(loader);

      if (roomId) {
        peer = new Peer(hostPeerId, peerConfig);

        peer.on('open', () => {
          logScreen("Хост очікує другого гравця...");
        });

        peer.on('connection', (c) => {
          dataConn = c;
          setBrandStatus("DENDYGRAM • P2 ONLINE!", "#22c55e");
          logScreen("Гравець 2 підключився!", "info");

          c.on('data', (d) => {
            if (d && d.t === 'INP') {
              sendEjsInput(1, d.b, d.v);
              logScreen(`P2 TAP -> btn=${d.b} val=${d.v}`);
            }
          });

          initLowLatencyStream(c.peer);
        });

        peer.on('error', (err) => logScreen(`Peer хоста: ${err.type}`, "err"));
      }
    }

    // ==========================================
    // ІНІЦІАЛІЗАЦІЯ ШВИДКОГО ПОТОКУ (0 LATENCY)
    // ==========================================
    function initLowLatencyStream(guestId) {
      let tries = 0;
      const t = setInterval(() => {
        tries++;
        const canvas = document.querySelector('#game canvas');
        if (canvas && canvas.width > 50) {
          clearInterval(t);
          logScreen(`Канвас (${canvas.width}x${canvas.height}). Формуємо 60 FPS стрім...`, "info");
          try {
            const stream = canvas.captureStream(60);
            const vTrack = stream.getVideoTracks()[0];
            if (vTrack && 'contentHint' in vTrack) {
              vTrack.contentHint = 'detail';
            }

            const call = peer.call(guestId, stream);

            if (call && call.peerConnection) {
              const pc = call.peerConnection;
              pc.addEventListener('negotiationneeded', async () => {
                try {
                  const senders = pc.getSenders();
                  const vSender = senders.find(s => s.track && s.track.kind === 'video');
                  if (vSender) {
                    const p = vSender.getParameters();
                    if (!p.encodings) p.encodings = [{}];
                    p.encodings[0].maxBitrate = 1500000; // 1.5 Mbps — без буферизації
                    p.encodings[0].maxFramerate = 60;
                    p.encodings[0].networkPriority = 'high';
                    p.encodings[0].priority = 'high';
                    await vSender.setParameters(p);
                  }
                } catch(e) {}
              });
            }

            logScreen("Ультра-стрім надіслано гостю!", "info");
          } catch(e) {
            logScreen(`Помилка captureStream: ${e.message}`, "err");
          }
        }
        if (tries > 50) {
          clearInterval(t);
          logScreen("Таймаут очікування канвасу!", "warn");
        }
      }, 300);
    }

    // ==========================================
    // КНОПКИ
    // ==========================================
    function handleButtonAction(btnId, isDown) {
      const val = isDown ? 1 : 0;
      if (isGuest) {
        if (dataConn && dataConn.open) {
          dataConn.send({ t: 'INP', b: btnId, v: val });
          logScreen(`P2 тап: btn=${btnId} val=${val}`);
        } else {
          logScreen("Немає з'єднання", "warn");
        }
      } else {
        sendEjsInput(0, btnId, val);
        logScreen(`P1 тап: btn=${btnId} val=${val}`);
      }
    }

    document.querySelectorAll('[data-btn]').forEach(elem => {
      const btnId = parseInt(elem.getAttribute('data-btn'), 10);

      const down = (e) => {
        e.preventDefault();
        elem.classList.add('pressed');
        handleButtonAction(btnId, true);
      };

      const up = (e) => {
        e.preventDefault();
        elem.classList.remove('pressed');
        handleButtonAction(btnId, false);
      };

      elem.addEventListener('pointerdown', down);
      elem.addEventListener('pointerup', up);
      elem.addEventListener('pointercancel', up);
      elem.addEventListener('pointerleave', up);
    });
  </script>
</body>
</html>

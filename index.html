<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DendyGram 30FPS WRAM Sync</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      margin: 0;
      background: #121214;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }

    .console {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 820px;
      background: #272730;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 2px 3px rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      padding: 12px 8px;
      touch-action: none;
      position: relative;
    }

    .screen-bezel {
      background: #111113;
      border-radius: 16px;
      padding: 8px 8px 6px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 4px;
    }

    .brand {
      color: #71717a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 6px;
      transition: color 0.3s ease;
      text-transform: uppercase;
    }

    #game-container {
      width: 100%;
      height: 240px;
      min-height: 240px;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    #game {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }

    #game canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      image-rendering: pixelated !important;
      background: #000;
    }

    #game .ejs_virtual_gamepad,
    #game .ejs_menu,
    #game .ejs_start_screen,
    #game [id*="controls_menu"] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .logger-wrapper {
      position: relative;
      margin: 6px 4px;
    }

    #screen-logger {
      height: 75px;
      background: rgba(10, 10, 14, 0.92);
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 10px;
      line-height: 1.35;
      color: #22c55e;
      overflow-y: auto;
      word-break: break-all;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
      z-index: 50;
      touch-action: pan-y !important;
      -webkit-user-select: text !important;
      user-select: text !important;
      cursor: text;
    }

    #screen-logger * {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    .copy-log-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #27272a;
      border: 1px solid #52525b;
      color: #fafafa;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.8;
      z-index: 60;
    }

    .copy-log-btn:active {
      background: #38bdf8;
      color: #000;
    }

    .log-err { color: #ef4444; font-weight: bold; }
    .log-warn { color: #facc15; }
    .log-info { color: #38bdf8; }

    .controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 4px 10px;
    }

    .main-pads {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 2px;
    }

    .dpad {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .dpad-btn {
      position: absolute;
      background: #1c1c22;
      border: 2px solid #0f0f13;
      box-shadow: 0 4px 0 #09090b;
      border-radius: 6px;
      cursor: pointer;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      box-shadow: 0 1px 0 #09090b;
      transform: translateY(3px);
      background: #2b2b35;
    }

    .dpad-up { top: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-down { bottom: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-left { top: 45px; left: 0; width: 45px; height: 40px; }
    .dpad-right { top: 45px; right: 0; width: 45px; height: 40px; }
    .dpad-center {
      position: absolute;
      top: 45px;
      left: 45px;
      width: 40px;
      height: 40px;
      background: #1c1c22;
    }

    .action-buttons {
      display: flex;
      gap: 14px;
      transform: rotate(-25deg);
      margin-right: 2px;
    }

    .action-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dc2626;
      border: 2px solid #7f1d1d;
      box-shadow: 0 5px 0 #500724;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .action-btn:active, .action-btn.pressed {
      box-shadow: 0 1px 0 #500724;
      transform: translateY(4px);
      background: #ef4444;
    }

    .system-pads {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 4px;
    }

    .sys-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .sys-btn {
      width: 48px;
      height: 14px;
      background: #52525b;
      border: 1px solid #27272a;
      border-radius: 8px;
      transform: rotate(-25deg);
      box-shadow: 0 2px 0 #18181b;
      cursor: pointer;
    }

    .sys-btn:active, .sys-btn.pressed {
      box-shadow: none;
      transform: rotate(-25deg) translateY(2px);
    }

    .sys-label {
      font-size: 10px;
      color: #a1a1aa;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="console">
    <div class="screen-bezel">
      <div id="game-container">
        <div id="game"></div>
      </div>
      <div class="brand">DENDYGRAM • 30 FPS WRAM</div>
    </div>

    <div class="logger-wrapper">
      <div id="screen-logger"></div>
      <button class="copy-log-btn" id="copy-btn">COPY</button>
    </div>

    <div class="controls">
      <div class="main-pads">
        <div class="dpad">
          <div class="dpad-center"></div>
          <div class="dpad-btn dpad-up" data-btn="4"></div>
          <div class="dpad-btn dpad-down" data-btn="5"></div>
          <div class="dpad-btn dpad-left" data-btn="6"></div>
          <div class="dpad-btn dpad-right" data-btn="7"></div>
        </div>

        <div class="action-buttons">
          <div class="action-btn" data-btn="0">B</div>
          <div class="action-btn" data-btn="8">A</div>
        </div>
      </div>

      <div class="system-pads">
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="2"></div>
          <span class="sys-label">SELECT</span>
        </div>
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="3"></div>
          <span class="sys-label">START</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const loggerEl = document.getElementById('screen-logger');
    const copyBtn = document.getElementById('copy-btn');

    function logScreen(msg, type = 'normal') {
      if (!loggerEl) return;
      const d = document.createElement('div');
      const time = new Date().toTimeString().split(' ')[0].substring(3);
      d.textContent = `[${time}] ${msg}`;
      if (type === 'err') d.className = 'log-err';
      else if (type === 'warn') d.className = 'log-warn';
      else if (type === 'info') d.className = 'log-info';
      loggerEl.appendChild(d);
      loggerEl.scrollTop = loggerEl.scrollHeight;
    }

    if (copyBtn) {
      copyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(loggerEl.innerText).then(() => {
          logScreen("Логи скопійовано!", "info");
        });
      });
    }

    window.onerror = function(msg, url, line) {
      logScreen(`CRASH: ${msg} (L:${line})`, 'err');
      return false;
    };

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    function decodeBase64Url(str) {
      if (!str) return '';
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      try { return decodeURIComponent(escape(atob(str))); } catch (e) { return atob(str); }
    }

    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const urlParams = new URLSearchParams(window.location.search);

    let appData = {};
    const rawApp = hashParams.get('app');
    if (rawApp) {
      try { appData = JSON.parse(decodeBase64Url(rawApp)); } catch (e) {}
    }

    let targetRom = appData.rom || hashParams.get('rom') || urlParams.get('rom') || urlParams.get('startapp') || tg?.initDataUnsafe?.start_param;
    const roomId = appData.room || hashParams.get('room') || urlParams.get('room');
    const rawP = appData.p || hashParams.get('player') || hashParams.get('p') || urlParams.get('player') || urlParams.get('p');
    const isGuest = (rawP == 2 || rawP === '2');

    if (!targetRom) {
      targetRom = "https://cdn.emulatorjs.org/stable/data/roms/nes/Super%20Mario%20Bros%20(Japan,%20USA).nes";
    }

    const brandElem = document.querySelector('.brand');
    function setBrandStatus(text, color) {
      if (!brandElem) return;
      brandElem.textContent = text;
      if (color) brandElem.style.color = color;
    }

    setBrandStatus(`DENDYGRAM • ${isGuest ? 'P2 (GUEST)' : 'P1 (HOST)'}`, isGuest ? '#34d399' : '#38bdf8');
    logScreen(`Роль: ${isGuest ? 'P2' : 'P1'} | Кімната: ${roomId || 'Соло'}`);

    // --- РОБОТА З WRAM 2048 БАЙТ ТА ПОРТАМИ ---
    function sendEjsInput(port, btnId, val) {
      const emu = window.EJS_emulator;
      let ok = false;

      try {
        if (emu?.gameManager?.setInputValue) {
          emu.gameManager.setInputValue(port, btnId, val);
          ok = true;
        }
        if (emu?.controls?.simulateButton) {
          emu.controls.simulateButton(port, btnId, val);
          ok = true;
        }
      } catch (e) {}

      // Для Хоста дублюємо клавішами
      if (port === 0) {
        const evType = val ? 'keydown' : 'keyup';
        const canvas = document.querySelector('#game canvas');
        function fireKey(k, c, codeNum) {
          const ev = new KeyboardEvent(evType, {
            key: k, code: c, keyCode: codeNum, which: codeNum,
            bubbles: true, cancelable: true, view: window
          });
          if (canvas) canvas.dispatchEvent(ev);
          window.dispatchEvent(ev);
        }

        if (btnId === 2) {
          fireKey('Shift', 'ShiftLeft', 16);
          fireKey('v', 'KeyV', 86);
        } else if (btnId === 3) fireKey('Enter', 'Enter', 13);
        else if (btnId === 0) fireKey('z', 'KeyZ', 90);
        else if (btnId === 8) fireKey('x', 'KeyX', 88);
        else if (btnId === 4) fireKey('ArrowUp', 'ArrowUp', 38);
        else if (btnId === 5) fireKey('ArrowDown', 'ArrowDown', 40);
        else if (btnId === 6) fireKey('ArrowLeft', 'ArrowLeft', 37);
        else if (btnId === 7) fireKey('ArrowRight', 'ArrowRight', 39);
      }
      return ok;
    }

    function getRawNesRam() {
      try {
        if (window.Module && window.Module.HEAPU8 && window.Module._retro_get_memory_data) {
          const ptr = window.Module._retro_get_memory_data(0);
          if (ptr) {
            return new Uint8Array(window.Module.HEAPU8.buffer, ptr, 2048).slice();
          }
        }
        const emu = window.EJS_emulator;
        if (emu?.gameManager?.getState) {
          const fullState = emu.gameManager.getState();
          if (fullState && fullState.length >= 2048) {
            return fullState.slice(0, 2048);
          }
        }
      } catch (e) {}
      return null;
    }

    function setRawNesRam(ramChunk) {
      try {
        if (window.Module && window.Module.HEAPU8 && window.Module._retro_get_memory_data) {
          const ptr = window.Module._retro_get_memory_data(0);
          if (ptr) {
            window.Module.HEAPU8.set(ramChunk, ptr);
          }
        }
      } catch (e) {}
    }

    // --- СТАРТ ЕМУЛЯТОРА ---
    let cleanRom = targetRom;
    try {
      if (cleanRom.startsWith('http')) {
        try { cleanRom = decodeURIComponent(cleanRom); } catch(e) {}
      } else {
        cleanRom = decodeBase64Url(cleanRom);
      }
    } catch (e) {}

    window.EJS_player = '#game';
    window.EJS_core = 'nes';
    window.EJS_gameUrl = cleanRom;
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_alignStartButton = false;
    window.EJS_disableToolbar = true;
    window.EJS_VirtualGamepadSettings = [0, 0];
    window.EJS_mouse = false;

    const loader = document.createElement('script');
    loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    loader.async = true;
    loader.onload = () => logScreen("Ядро завантажено!");
    loader.onerror = () => logScreen("Помилка CDN ядра!", "err");
    document.head.appendChild(loader);

    // --- P2P МЕРЕЖА ---
    const meteredIceServers = [
      { urls: "stun:stun.relay.metered.ca:80" },
      { urls: "turn:global.relay.metered.ca:80", username: "d7695a22150cfea32f5b287e", credential: "Jm8+83G3JIEbY+Dj" },
      { urls: "turn:global.relay.metered.ca:443", username: "d7695a22150cfea32f5b287e", credential: "Jm8+83G3JIEbY+Dj" }
    ];

    let peer = null;
    let dataConn = null;
    let ramInterval = null;
    const hostPeerId = `dendygram_ram_${roomId}`;

    if (roomId) {
      const peerConfig = { config: { iceServers: meteredIceServers } };

      if (!isGuest) {
        // === ХОСТ (P1) ===
        peer = new Peer(hostPeerId, peerConfig);

        peer.on('connection', (c) => {
          dataConn = c;
          setBrandStatus("DENDYGRAM • 30 FPS LIVE", "#22c55e");
          logScreen("P2 зайшов! Синхронізація стартового стейту...", "info");

          // 1. Повний стейт тільки на старті
          setTimeout(() => {
            sendFullInitialState();
          }, 1500);

          // Обробка кнопок від P2 напряму в порт 1
          c.on('data', (d) => {
            if (d.t === 'INP') {
              sendEjsInput(1, d.b, d.v);
            }
          });

          // 2. Стрім 2048 байт RAM кожні 33 мс (30 FPS)
          if (ramInterval) clearInterval(ramInterval);
          ramInterval = setInterval(streamFastRam, 33);
        });

      } else {
        // === ГІСТЬ (P2) ===
        peer = new Peer(peerConfig);

        peer.on('open', () => {
          logScreen("P2 підключається до хоста...", "info");
          dataConn = peer.connect(hostPeerId, { reliable: false });

          dataConn.on('open', () => {
            setBrandStatus("DENDYGRAM • 30 FPS LIVE", "#22c55e");
            logScreen("Канал відкрито! Очікуємо синхрон...", "info");
          });

          dataConn.on('data', (d) => {
            if (d.t === 'INIT_STATE' && d.b) {
              if (window.EJS_emulator?.gameManager?.loadState) {
                window.EJS_emulator.gameManager.loadState(new Uint8Array(d.b));
                logScreen("Початковий стейт накладено!", "info");
              }
            } else if (d.t === 'RAM' && d.b) {
              setRawNesRam(new Uint8Array(d.b));
            } else if (d.t === 'P1_INP') {
              sendEjsInput(0, d.b, d.v);
            }
          });
        });
      }
    }

    function sendFullInitialState() {
      if (!dataConn || !dataConn.open) return;
      try {
        const emu = window.EJS_emulator;
        if (emu?.gameManager?.getState) {
          const st = emu.gameManager.getState();
          if (st) {
            dataConn.send({ t: 'INIT_STATE', b: st });
            logScreen("Стартовий стейт передано P2", "info");
          }
        }
      } catch(e) {}
    }

    function streamFastRam() {
      if (!dataConn || !dataConn.open) return;
      const ram = getRawNesRam();
      if (ram) {
        dataConn.send({ t: 'RAM', b: ram });
      }
    }

    // Обробка тапу
    function handleButtonAction(btnId, isDown) {
      const val = isDown ? 1 : 0;

      if (isGuest) {
        sendEjsInput(1, btnId, val);
        if (dataConn && dataConn.open) {
          dataConn.send({ t: 'INP', b: btnId, v: val });
        }
        logScreen(`P2 тап -> btn=${btnId} val=${val}`);
      } else {
        sendEjsInput(0, btnId, val);
        if (dataConn && dataConn.open) {
          dataConn.send({ t: 'P1_INP', b: btnId, v: val });
        }
        logScreen(`P1 тап -> btn=${btnId} val=${val}`);
      }
    }

    document.querySelectorAll('[data-btn]').forEach(elem => {
      const btnId = parseInt(elem.getAttribute('data-btn'), 10);

      const down = (e) => {
        e.preventDefault();
        elem.classList.add('pressed');
        handleButtonAction(btnId, true);
      };

      const up = (e) => {
        e.preventDefault();
        elem.classList.remove('pressed');
        handleButtonAction(btnId, false);
      };

      elem.addEventListener('pointerdown', down);
      elem.addEventListener('pointerup', up);
      elem.addEventListener('pointercancel', up);
      elem.addEventListener('pointerleave', up);
    });
  </script>
</body>
</html>

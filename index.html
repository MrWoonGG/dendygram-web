<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DendyGram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      margin: 0;
      background: #121214;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }

    .console {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 820px;
      background: #272730;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 2px 3px rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      padding: 12px 8px;
      touch-action: none;
    }

    .screen-bezel {
      background: #111113;
      border-radius: 16px;
      padding: 8px 8px 6px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 4px;
    }

    .brand {
      color: #71717a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 6px;
      transition: color 0.3s ease;
      text-transform: uppercase;
    }

    #game-container {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    #game {
      width: 100% !important;
      height: 100% !important;
    }

    #game canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Гасимо стандартний сенсорний шар і налаштування EmulatorJS */
    #game .ejs_virtual_gamepad,
    #game .ejs_menu,
    #game .ejs_start_screen,
    #game [id*="controls_menu"],
    #game [id*="gamepad_menu"] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 4px 10px;
    }

    .main-pads {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 2px;
    }

    .dpad {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .dpad-btn {
      position: absolute;
      background: #1c1c22;
      border: 2px solid #0f0f13;
      box-shadow: 0 4px 0 #09090b;
      border-radius: 6px;
      cursor: pointer;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      box-shadow: 0 1px 0 #09090b;
      transform: translateY(3px);
      background: #2b2b35;
    }

    .dpad-up { top: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-down { bottom: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-left { top: 45px; left: 0; width: 45px; height: 40px; }
    .dpad-right { top: 45px; right: 0; width: 45px; height: 40px; }
    .dpad-center {
      position: absolute;
      top: 45px;
      left: 45px;
      width: 40px;
      height: 40px;
      background: #1c1c22;
    }

    .action-buttons {
      display: flex;
      gap: 14px;
      transform: rotate(-25deg);
      margin-right: 2px;
    }

    .action-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dc2626;
      border: 2px solid #7f1d1d;
      box-shadow: 0 5px 0 #500724;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .action-btn:active, .action-btn.pressed {
      box-shadow: 0 1px 0 #500724;
      transform: translateY(4px);
      background: #ef4444;
    }

    .system-pads {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 8px;
    }

    .sys-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .sys-btn {
      width: 48px;
      height: 14px;
      background: #52525b;
      border: 1px solid #27272a;
      border-radius: 8px;
      transform: rotate(-25deg);
      box-shadow: 0 2px 0 #18181b;
      cursor: pointer;
    }

    .sys-btn:active, .sys-btn.pressed {
      box-shadow: none;
      transform: rotate(-25deg) translateY(2px);
    }

    .sys-label {
      font-size: 10px;
      color: #a1a1aa;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="console">
    <div class="screen-bezel">
      <div id="game-container">
        <div id="game"></div>
      </div>
      <div class="brand">DENDYGRAM • PORTABLE</div>
    </div>

    <div class="controls">
      <div class="main-pads">
        <div class="dpad">
          <div class="dpad-center"></div>
          <div class="dpad-btn dpad-up" data-btn="12"></div>
          <div class="dpad-btn dpad-down" data-btn="13"></div>
          <div class="dpad-btn dpad-left" data-btn="14"></div>
          <div class="dpad-btn dpad-right" data-btn="15"></div>
        </div>

        <div class="action-buttons">
          <div class="action-btn" data-btn="0">B</div>
          <div class="action-btn" data-btn="1">A</div>
        </div>
      </div>

      <div class="system-pads">
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="8"></div>
          <span class="sys-label">SELECT</span>
        </div>
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="9"></div>
          <span class="sys-label">START</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. АПАРАТНА ЕМУЛЯЦІЯ ДВОХ ГЕЙМПАДІВ (W3C API)
    // ==========================================
    function createVirtualGamepad(index, id) {
      const buttons = [];
      for (let i = 0; i < 17; i++) {
        buttons.push({ pressed: false, touched: false, value: 0.0 });
      }
      return {
        id: id,
        index: index,
        connected: true,
        mapping: 'standard',
        timestamp: performance.now(),
        axes: [0.0, 0.0, 0.0, 0.0],
        buttons: buttons
      };
    }

    const virtualGamepads = [
      createVirtualGamepad(0, "Dendy Controller P1 (STANDARD GAMEPAD)"),
      createVirtualGamepad(1, "Dendy Controller P2 (STANDARD GAMEPAD)")
    ];

    navigator.getGamepads = function() {
      const now = performance.now();
      virtualGamepads[0].timestamp = now;
      virtualGamepads[1].timestamp = now;
      return virtualGamepads;
    };

    function setPadButton(playerIdx, btnIdx, isPressed) {
      if (virtualGamepads[playerIdx] && virtualGamepads[playerIdx].buttons[btnIdx]) {
        virtualGamepads[playerIdx].buttons[btnIdx].pressed = isPressed;
        virtualGamepads[playerIdx].buttons[btnIdx].value = isPressed ? 1.0 : 0.0;
      }
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        try {
          window.dispatchEvent(new Event('gamepadconnected'));
        } catch(e) {}
      }, 600);
    });

    // ==========================================
    // 2. ПАРСИНГ ПАРАМЕТРІВ ЗАПУСКУ
    // ==========================================
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    function decodeBase64Url(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return decodeURIComponent(escape(atob(str)));
    }

    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const urlParams = new URLSearchParams(window.location.search);

    let appData = {};
    const rawApp = hashParams.get('app');
    if (rawApp) {
      try {
        appData = JSON.parse(decodeBase64Url(rawApp));
      } catch (e) {}
    }

    let targetRom = appData.rom || hashParams.get('rom') || urlParams.get('rom') || urlParams.get('startapp') || tg?.initDataUnsafe?.start_param;
    const roomId = appData.room || hashParams.get('room') || urlParams.get('room');
    const playerNum = parseInt(appData.p || hashParams.get('player') || urlParams.get('player') || '1', 10);

    const brandElem = document.querySelector('.brand');
    function setBrandStatus(text, color) {
      if (!brandElem) return;
      brandElem.textContent = text;
      if (color) brandElem.style.color = color;
    }

    if (roomId) {
      setBrandStatus(`DENDYGRAM • DUO (P${playerNum})`, playerNum === 1 ? '#38bdf8' : '#34d399');
    }

    // ==========================================
    // 3. СТАРТ ЛОКАЛЬНОГО ЕМУЛЯТОРА (У ОБОХ ГРАВЦІВ)
    // ==========================================
    if (targetRom) {
      try {
        if (!targetRom.startsWith('http')) {
          targetRom = decodeBase64Url(targetRom);
        } else {
          targetRom = decodeURIComponent(targetRom);
        }
      } catch (e) {}

      window.EJS_player = '#game';
      window.EJS_core = 'nes';
      window.EJS_gameUrl = targetRom;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_alignStartButton = false;
      window.EJS_disableToolbar = true;
      window.EJS_VirtualGamepadSettings = [0, 0];
      window.EJS_mouse = false;

      // Примусово тримаємо 2 гравці в рушії
      window.EJS_defaultPlayers = 2;

      const loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(loader);
    }

    // ==========================================
    // 4. МЕРЕЖА: P2P TURN DATACHANNEL ТА СИНХРОНІЗАЦІЯ
    // ==========================================
    const meteredIceServers = [
      { urls: "stun:stun.relay.metered.ca:80" },
      {
        urls: "turn:global.relay.metered.ca:80",
        username: "d7695a22150cfea32f5b287e",
        credential: "Jm8+83G3JIEbY+Dj"
      },
      {
        urls: "turn:global.relay.metered.ca:443",
        username: "d7695a22150cfea32f5b287e",
        credential: "Jm8+83G3JIEbY+Dj"
      }
    ];

    let peer = null;
    let conn = null;

    if (roomId) {
      const peerConfig = {
        config: { iceServers: meteredIceServers }
      };
      const hostPeerId = `dendygram_sync_${roomId}`;

      if (playerNum === 1) {
        // --- ХОСТ (P1) ---
        peer = new Peer(hostPeerId, peerConfig);

        peer.on('connection', (c) => {
          conn = c;
          setBrandStatus("DENDYGRAM • DUO SYNCED!", "#22c55e");

          conn.on('data', (data) => {
            if (!data) return;

            // 1. Інпут від P2 -> записуємо у віртуальний джойстик 1
            if (data.t === 'btn') {
              setPadButton(1, data.b, data.d);
            }

            // 2. Якщо гість просить початковий синхрон стейту
            if (data.t === 'req_state') {
              sendCurrentState();
            }
          });

          conn.on('close', () => {
            setBrandStatus("DENDYGRAM • P2 ВІДПАВ :(", "#eab308");
          });

          // Перший снапшот через секунду після з'єднання
          setTimeout(sendCurrentState, 1500);
        });

      } else {
        // --- КЛІЄНТ (P2) ---
        peer = new Peer(peerConfig);

        peer.on('open', () => {
          conn = peer.connect(hostPeerId, { reliable: true });

          conn.on('open', () => {
            setBrandStatus("DENDYGRAM • DUO SYNCED!", "#22c55e");
            // Просимо хоста вирівняти стейт
            conn.send({ t: 'req_state' });
          });

          conn.on('data', (data) => {
            if (!data) return;

            // Інпут від хоста -> записуємо у віртуальний джойстик 0
            if (data.t === 'btn') {
              setPadButton(0, data.b, data.d);
            }

            // Отримали снапшот пам'яті від хоста -> накатуємо у свій емулятор
            if (data.t === 'state' && data.buf) {
              applyHostState(data.buf);
            }
          });

          conn.on('close', () => {
            setBrandStatus("DENDYGRAM • ХОСТ ВІДПАВ", "#ef4444");
          });
        });
      }
    }

    // Зняття та відправка стейту хостом
    function sendCurrentState() {
      if (!conn || !conn.open || playerNum !== 1) return;
      try {
        const emu = window.EJS_emulator;
        if (emu && emu.gameManager && typeof emu.gameManager.getState === 'function') {
          const stateData = emu.gameManager.getState();
          if (stateData) {
            conn.send({ t: 'state', buf: stateData });
          }
        }
      } catch (e) {
        console.warn("Не вдалося зняти savestate:", e);
      }
    }

    // Застосування стейту в клієнта
    function applyHostState(rawBuffer) {
      try {
        const emu = window.EJS_emulator;
        if (emu && emu.gameManager && typeof emu.gameManager.loadState === 'function') {
          emu.gameManager.loadState(rawBuffer);
        }
      } catch (e) {
        console.warn("Не вдалося накатити savestate:", e);
      }
    }

    // Періодична тиха звірка стейту хостом кожні 8 секунд
    if (playerNum === 1) {
      setInterval(sendCurrentState, 8000);
    }

    // ==========================================
    // 5. ОБРОБКА КНОПОК
    // 0: B, 1: A, 8: SELECT, 9: START, 12: UP, 13: DOWN, 14: LEFT, 15: RIGHT
    // ==========================================
    function handleButton(btnIdx, isDown) {
      const myPadIndex = (roomId && playerNum === 2) ? 1 : 0;

      // Локально для свого віртуального контролера
      setPadButton(myPadIndex, btnIdx, isDown);

      // Миттєво шлемо партнеру по P2P
      if (conn && conn.open) {
        conn.send({ t: 'btn', b: btnIdx, d: isDown });
      }
    }

    document.querySelectorAll('[data-btn]').forEach(elem => {
      const btn = parseInt(elem.getAttribute('data-btn'), 10);

      const down = (e) => {
        e.preventDefault();
        elem.classList.add('pressed');
        handleButton(btn, true);
      };

      const up = (e) => {
        e.preventDefault();
        elem.classList.remove('pressed');
        handleButton(btn, false);
      };

      elem.addEventListener('pointerdown', down);
      elem.addEventListener('pointerup', up);
      elem.addEventListener('pointercancel', up);
      elem.addEventListener('pointerleave', up);
    });
  </script>
</body>
</html>

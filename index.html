<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DendyGram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      margin: 0;
      background: #121214;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }

    .console {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 820px;
      background: #272730;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 2px 3px rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      padding: 12px 8px;
      touch-action: none;
    }

    .screen-bezel {
      background: #111113;
      border-radius: 16px;
      padding: 8px 8px 6px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 4px;
    }

    .brand {
      color: #71717a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 6px;
      transition: color 0.3s ease;
      text-transform: uppercase;
    }

    #game-container {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    #game {
      width: 100% !important;
      height: 100% !important;
    }

    #game canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      image-rendering: pixelated;
    }

    #game .ejs_virtual_gamepad,
    #game .ejs_menu,
    #game .ejs_start_screen,
    #game [id*="controls_menu"] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 4px 10px;
    }

    .main-pads {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 2px;
    }

    .dpad {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .dpad-btn {
      position: absolute;
      background: #1c1c22;
      border: 2px solid #0f0f13;
      box-shadow: 0 4px 0 #09090b;
      border-radius: 6px;
      cursor: pointer;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      box-shadow: 0 1px 0 #09090b;
      transform: translateY(3px);
      background: #2b2b35;
    }

    .dpad-up { top: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-down { bottom: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-left { top: 45px; left: 0; width: 45px; height: 40px; }
    .dpad-right { top: 45px; right: 0; width: 45px; height: 40px; }
    .dpad-center {
      position: absolute;
      top: 45px;
      left: 45px;
      width: 40px;
      height: 40px;
      background: #1c1c22;
    }

    .action-buttons {
      display: flex;
      gap: 14px;
      transform: rotate(-25deg);
      margin-right: 2px;
    }

    .action-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dc2626;
      border: 2px solid #7f1d1d;
      box-shadow: 0 5px 0 #500724;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .action-btn:active, .action-btn.pressed {
      box-shadow: 0 1px 0 #500724;
      transform: translateY(4px);
      background: #ef4444;
    }

    .system-pads {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 8px;
    }

    .sys-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .sys-btn {
      width: 48px;
      height: 14px;
      background: #52525b;
      border: 1px solid #27272a;
      border-radius: 8px;
      transform: rotate(-25deg);
      box-shadow: 0 2px 0 #18181b;
      cursor: pointer;
    }

    .sys-btn:active, .sys-btn.pressed {
      box-shadow: none;
      transform: rotate(-25deg) translateY(2px);
    }

    .sys-label {
      font-size: 10px;
      color: #a1a1aa;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="console">
    <div class="screen-bezel">
      <div id="game-container">
        <div id="game"></div>
      </div>
      <div class="brand">DENDYGRAM • PORTABLE</div>
    </div>

    <div class="controls">
      <div class="main-pads">
        <div class="dpad">
          <div class="dpad-center"></div>
          <div class="dpad-btn dpad-up" data-btn="12"></div>
          <div class="dpad-btn dpad-down" data-btn="13"></div>
          <div class="dpad-btn dpad-left" data-btn="14"></div>
          <div class="dpad-btn dpad-right" data-btn="15"></div>
        </div>

        <div class="action-buttons">
          <div class="action-btn" data-btn="0">B</div>
          <div class="action-btn" data-btn="1">A</div>
        </div>
      </div>

      <div class="system-pads">
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="8"></div>
          <span class="sys-label">SELECT</span>
        </div>
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="9"></div>
          <span class="sys-label">START</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- 1. ВІРТУАЛЬНИЙ ХАК ДЛЯ HTML5 GAMEPAD API ---
    // Створюємо 2 повноцінні апаратні геймпади для браузера
    function makeGamepad(index, id) {
      const buttons = [];
      for (let i = 0; i < 17; i++) {
        buttons.push({ pressed: false, touched: false, value: 0.0 });
      }
      return {
        id: id,
        index: index,
        connected: true,
        mapping: 'standard',
        timestamp: performance.now(),
        axes: [0.0, 0.0, 0.0, 0.0],
        buttons: buttons
      };
    }

    const virtualGamepads = [
      makeGamepad(0, "Dendy Controller P1 (STANDARD GAMEPAD)"),
      makeGamepad(1, "Dendy Controller P2 (STANDARD GAMEPAD)")
    ];

    // Підміняємо API браузера, щоб емулятор БАЧИВ ДВА ДЖОЙСТИКИ
    navigator.getGamepads = function() {
      virtualGamepads[0].timestamp = performance.now();
      virtualGamepads[1].timestamp = performance.now();
      return virtualGamepads;
    };

    function setVirtualButton(playerIdx, btnIdx, isPressed) {
      if (virtualGamepads[playerIdx] && virtualGamepads[playerIdx].buttons[btnIdx]) {
        virtualGamepads[playerIdx].buttons[btnIdx].pressed = isPressed;
        virtualGamepads[playerIdx].buttons[btnIdx].value = isPressed ? 1.0 : 0.0;
      }
    }

    // --- 2. ПАРСИНГ ПАРАМЕТРІВ ---
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    function decodeBase64Url(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return decodeURIComponent(escape(atob(str)));
    }

    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const urlParams = new URLSearchParams(window.location.search);

    let appData = {};
    const rawApp = hashParams.get('app');
    if (rawApp) {
      try {
        appData = JSON.parse(decodeBase64Url(rawApp));
      } catch (e) {}
    }

    let targetRom = appData.rom || hashParams.get('rom') || urlParams.get('rom') || urlParams.get('startapp') || tg?.initDataUnsafe?.start_param;
    const roomId = appData.room || hashParams.get('room') || urlParams.get('room');
    const playerNum = parseInt(appData.p || hashParams.get('player') || urlParams.get('player') || '1', 10);

    const brandElem = document.querySelector('.brand');
    if (roomId && brandElem) {
      brandElem.textContent = `DENDYGRAM • DUO (P${playerNum})`;
      brandElem.style.color = playerNum === 1 ? '#38bdf8' : '#34d399';
    }

    // --- 3. ЗАПУСК ЕМУЛЯТОРА (БЕЗ ЖОДНИХ НЕТПЛЕЇВ ТА СТРІМІВ) ---
    if (targetRom) {
      try {
        if (!targetRom.startsWith('http')) {
          targetRom = decodeBase64Url(targetRom);
        } else {
          targetRom = decodeURIComponent(targetRom);
        }
      } catch (e) {}

      window.EJS_player = '#game';
      window.EJS_core = 'nes';
      window.EJS_gameUrl = targetRom;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_alignStartButton = false;
      window.EJS_disableToolbar = true;
      window.EJS_VirtualGamepadSettings = [0, 0];
      window.EJS_mouse = false;

      // Жодних сторонніх сокетів netplay! Чистий локальний 60 FPS рендер
      delete window.EJS_netplayUrl;

      const loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(loader);
    }

    // --- 4. МЕРЕЖА: ЛИШЕ ПЕРЕДАЧА СТАНУ ДЖОЙСТИКА P2 ---
    let peer = null;
    let conn = null;

    if (roomId) {
      const peerId = `dendygram_pad_room_${roomId}`;

      if (playerNum === 1) {
        // ХОСТ: слухає кнопки P2
        peer = new Peer(peerId);
        peer.on('connection', (c) => {
          conn = c;
          brandElem.textContent = "DENDYGRAM • P2 CONNECTED!";
          brandElem.style.color = "#22c55e";

          conn.on('data', (data) => {
            if (data && data.btn !== undefined) {
              setVirtualButton(1, data.btn, data.down); // пишемо в P2
            }
          });
        });
      } else {
        // PLAYER 2: підключається до хоста і відправляє свої тапи
        peer = new Peer();
        peer.on('open', () => {
          conn = peer.connect(peerId, { reliable: false }); // UDP режим для мілісекундного відгуку
          conn.on('open', () => {
            brandElem.textContent = "DENDYGRAM • READY (P2)";
            brandElem.style.color = "#22c55e";
          });
        });
      }
    }

    // Стандартні індекси HTML5 Gamepad:
    // 0: B, 1: A, 8: Select, 9: Start, 12: D-Up, 13: D-Down, 14: D-Left, 15: D-Right
    function handleButton(btnIdx, isDown) {
      if (roomId && playerNum === 2) {
        // Другий гравець шле пакет хосту
        if (conn && conn.open) {
          conn.send({ btn: btnIdx, down: isDown });
        }
        // І дублює локально в свій емулятор (якщо запустив гру для синхрону)
        setVirtualButton(1, btnIdx, isDown);
        return;
      }

      // Хост пише напряму в перший віртуальний контролер
      setVirtualButton(0, btnIdx, isDown);
    }

    // Прив'язка кнопок
    document.querySelectorAll('[data-btn]').forEach(elem => {
      const btn = parseInt(elem.getAttribute('data-btn'), 10);

      const down = (e) => {
        e.preventDefault();
        elem.classList.add('pressed');
        handleButton(btn, true);
      };

      const up = (e) => {
        e.preventDefault();
        elem.classList.remove('pressed');
        handleButton(btn, false);
      };

      elem.addEventListener('pointerdown', down);
      elem.addEventListener('pointerup', up);
      elem.addEventListener('pointercancel', up);
      elem.addEventListener('pointerleave', up);
    });
  </script>
</body>
</html>

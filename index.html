<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DendyGram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      margin: 0;
      background: #121214;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }

    .console {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 820px;
      background: #272730;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 2px 3px rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      padding: 12px 8px;
      touch-action: none;
    }

    .screen-bezel {
      background: #111113;
      border-radius: 16px;
      padding: 8px 8px 6px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 4px;
    }

    .brand {
      color: #71717a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 6px;
      transition: color 0.3s ease;
      text-transform: uppercase;
    }

    #game-container {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #game {
      width: 100% !important;
      height: 100% !important;
    }

    #remote-stream-video,
    #game canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      image-rendering: -moz-crisp-edges !important;
      image-rendering: -webkit-crisp-edges !important;
      image-rendering: pixelated !important;
      image-rendering: crisp-edges !important;
      background: #000;
    }

    /* Підсилюємо яскравість і чіткість стріму для клієнта */
    #remote-stream-video {
      filter: contrast(1.12) brightness(1.08) saturate(1.1);
    }

    #game .ejs_virtual_gamepad,
    #game .ejs_menu,
    #game .ejs_start_screen,
    #game [id*="controls_menu"] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #waiting-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #09090b;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fafafa;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 4px 10px;
    }

    .main-pads {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 2px;
    }

    .dpad {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .dpad-btn {
      position: absolute;
      background: #1c1c22;
      border: 2px solid #0f0f13;
      box-shadow: 0 4px 0 #09090b;
      border-radius: 6px;
      cursor: pointer;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      box-shadow: 0 1px 0 #09090b;
      transform: translateY(3px);
      background: #2b2b35;
    }

    .dpad-up { top: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-down { bottom: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-left { top: 45px; left: 0; width: 45px; height: 40px; }
    .dpad-right { top: 45px; right: 0; width: 45px; height: 40px; }
    .dpad-center {
      position: absolute;
      top: 45px;
      left: 45px;
      width: 40px;
      height: 40px;
      background: #1c1c22;
    }

    .action-buttons {
      display: flex;
      gap: 14px;
      transform: rotate(-25deg);
      margin-right: 2px;
    }

    .action-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dc2626;
      border: 2px solid #7f1d1d;
      box-shadow: 0 5px 0 #500724;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .action-btn:active, .action-btn.pressed {
      box-shadow: 0 1px 0 #500724;
      transform: translateY(4px);
      background: #ef4444;
    }

    .system-pads {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 8px;
    }

    .sys-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .sys-btn {
      width: 48px;
      height: 14px;
      background: #52525b;
      border: 1px solid #27272a;
      border-radius: 8px;
      transform: rotate(-25deg);
      box-shadow: 0 2px 0 #18181b;
      cursor: pointer;
    }

    .sys-btn:active, .sys-btn.pressed {
      box-shadow: none;
      transform: rotate(-25deg) translateY(2px);
    }

    .sys-label {
      font-size: 10px;
      color: #a1a1aa;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="console">
    <div class="screen-bezel">
      <div id="game-container">
        <div id="game"></div>
        <div id="waiting-overlay">
          <div class="spinner"></div>
          <div id="overlay-msg" style="font-weight: 700; font-size: 14px; margin-bottom: 6px;">ПІДКЛЮЧЕННЯ ДО ХОСТА...</div>
          <div id="overlay-sub" style="color: #71717a; font-size: 11px;">Синхронізуємо 30 FPS відеопотік...</div>
        </div>
      </div>
      <div class="brand">DENDYGRAM • PORTABLE</div>
    </div>

    <div class="controls">
      <div class="main-pads">
        <div class="dpad">
          <div class="dpad-center"></div>
          <div class="dpad-btn dpad-up" data-btn="4"></div>
          <div class="dpad-btn dpad-down" data-btn="5"></div>
          <div class="dpad-btn dpad-left" data-btn="6"></div>
          <div class="dpad-btn dpad-right" data-btn="7"></div>
        </div>

        <div class="action-buttons">
          <div class="action-btn" data-btn="0">B</div>
          <div class="action-btn" data-btn="8">A</div>
        </div>
      </div>

      <div class="system-pads">
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="2"></div>
          <span class="sys-label">SELECT</span>
        </div>
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="3"></div>
          <span class="sys-label">START</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    function decodeBase64Url(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return decodeURIComponent(escape(atob(str)));
    }

    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const urlParams = new URLSearchParams(window.location.search);

    let appData = {};
    const rawApp = hashParams.get('app');
    if (rawApp) {
      try {
        appData = JSON.parse(decodeBase64Url(rawApp));
      } catch (e) {
        console.error("appData parse error:", e);
      }
    }

    let targetRom = appData.rom || hashParams.get('rom') || urlParams.get('rom') || urlParams.get('startapp') || tg?.initDataUnsafe?.start_param;
    const roomId = appData.room || hashParams.get('room') || urlParams.get('room');
    const rawP = appData.p || hashParams.get('player') || hashParams.get('p') || urlParams.get('player') || urlParams.get('p');
    const isGuest = (rawP == 2 || rawP === '2');

    const brandElem = document.querySelector('.brand');
    const waitingOverlay = document.getElementById('waiting-overlay');
    const gameContainer = document.getElementById('game-container');

    function setBrandStatus(text, color) {
      if (!brandElem) return;
      brandElem.textContent = text;
      if (color) brandElem.style.color = color;
    }

    const meteredIceServers = [
      { urls: "stun:stun.relay.metered.ca:80" },
      {
        urls: "turn:global.relay.metered.ca:80",
        username: "d7695a22150cfea32f5b287e",
        credential: "Jm8+83G3JIEbY+Dj"
      },
      {
        urls: "turn:global.relay.metered.ca:443",
        username: "d7695a22150cfea32f5b287e",
        credential: "Jm8+83G3JIEbY+Dj"
      }
    ];

    const peerConfig = {
      config: {
        iceServers: meteredIceServers,
        sdpSemantics: 'unified-plan'
      }
    };

    // --- ПРЯМА ВІДПРАВКА В RETROARCH ЗА ЗНАЙДЕНИМИ ІНДЕКСАМИ ---
    function sendEjsInput(port, btnId, val) {
      try {
        if (window.EJS_emulator?.controls?.simulateButton) {
          window.EJS_emulator.controls.simulateButton(port, btnId, val);
        }
      } catch (e) {}

      try {
        if (window.EJS_emulator?.gameManager?.setInputValue) {
          window.EJS_emulator.gameManager.setInputValue(port, btnId, val);
        }
      } catch (e) {}
    }

    let peer = null;
    let dataConn = null;
    const hostPeerId = `dendygram_fast_stream_${roomId}`;

    function startHostEmulator() {
      try {
        if (!targetRom.startsWith('http')) {
          targetRom = decodeBase64Url(targetRom);
        } else {
          targetRom = decodeURIComponent(targetRom);
        }
      } catch (e) {}

      // Ініціалізація EJS
      window.EJS_player = '#game';
      window.EJS_core = 'nes';
      window.EJS_gameUrl = targetRom;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_alignStartButton = false;
      window.EJS_disableToolbar = true;
      window.EJS_VirtualGamepadSettings = [0, 0];
      window.EJS_mouse = false;
      window.EJS_defaultPlayers = 2;

      // ЯВНО РЕЄСТРУЄМО ДВОХ ГРАВЦІВ ЗА ДОКУМЕНТАЦІЄЮ!
      window.EJS_defaultControls = {
        0: {
          0: { 'value': 'x', 'value2': 'BUTTON_2' }, // B
          2: { 'value': 'v', 'value2': 'SELECT' },   // SELECT
          3: { 'value': 'enter', 'value2': 'START' },// START
          4: { 'value': 'up arrow', 'value2': 'DPAD_UP' },
          5: { 'value': 'down arrow', 'value2': 'DPAD_DOWN' },
          6: { 'value': 'left arrow', 'value2': 'DPAD_LEFT' },
          7: { 'value': 'right arrow', 'value2': 'DPAD_RIGHT' },
          8: { 'value': 'z', 'value2': 'BUTTON_1' }  // A
        },
        1: {
          0: { 'value': 'q', 'value2': 'BUTTON_2' }, // B (P2)
          2: { 'value': 't', 'value2': 'SELECT' },   // SELECT (P2)
          3: { 'value': 'y', 'value2': 'START' },    // START (P2)
          4: { 'value': 'i', 'value2': 'DPAD_UP' },
          5: { 'value': 'k', 'value2': 'DPAD_DOWN' },
          6: { 'value': 'j', 'value2': 'DPAD_LEFT' },
          7: { 'value': 'l', 'value2': 'DPAD_RIGHT' },
          8: { 'value': 'e', 'value2': 'BUTTON_1' }  // A (P2)
        }
      };

      const loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(loader);
    }

    if (roomId && isGuest) {
      setBrandStatus("DENDYGRAM • DUO (P2)", "#34d399");
      waitingOverlay.style.display = 'flex';

      const gameDiv = document.getElementById('game');
      if (gameDiv) gameDiv.remove();

      let video = document.getElementById('remote-stream-video');
      if (!video) {
        video = document.createElement('video');
        video.id = 'remote-stream-video';
        video.autoplay = true;
        video.playsInline = true;
        video.muted = true;
        gameContainer.appendChild(video);

        video.addEventListener('playing', () => {
          waitingOverlay.style.display = 'none';
          setBrandStatus("DENDYGRAM • 30 FPS LIVE", "#22c55e");
        });
      }

      peer = new Peer(peerConfig);

      peer.on('open', () => {
        dataConn = peer.connect(hostPeerId, { reliable: false });
      });

      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (stream) => {
          video.srcObject = stream;
          video.play().catch(e => console.warn("Play blocked:", e));
        });
      });

    } else {
      setBrandStatus(roomId ? "DENDYGRAM • DUO (HOST)" : "DENDYGRAM • SOLO", "#38bdf8");
      startHostEmulator();

      if (roomId) {
        peer = new Peer(hostPeerId, peerConfig);

        peer.on('connection', (c) => {
          dataConn = c;
          setBrandStatus("DENDYGRAM • P2 ONLINE!", "#22c55e");

          // Отримуємо тапи P2 і тиснемо в ПОРТ 1 за мапою
          c.on('data', (d) => {
            if (d && d.b !== undefined) {
              sendEjsInput(1, d.b, d.v);
            }
          });

          streamCanvasWithHardwareFps(c.peer);
        });
      }
    }

    function streamCanvasWithHardwareFps(targetPeerId) {
      const check = setInterval(() => {
        const canvas = document.querySelector('#game canvas');
        if (canvas && canvas.width > 0 && window.EJS_emulator) {
          clearInterval(check);

          const stream = canvas.captureStream(30);
          const track = stream.getVideoTracks()[0];

          if (track && 'contentHint' in track) {
            track.contentHint = 'detail';
          }

          const call = peer.call(targetPeerId, stream);

          if (call && call.peerConnection) {
            call.peerConnection.addEventListener('negotiationneeded', async () => {
              try {
                const senders = call.peerConnection.getSenders();
                const videoSender = senders.find(s => s.track && s.track.kind === 'video');
                if (videoSender) {
                  const params = videoSender.getParameters();
                  if (!params.encodings) params.encodings = [{}];
                  params.encodings[0].maxBitrate = 2500000;
                  params.encodings[0].maxFramerate = 30;
                  await videoSender.setParameters(params);
                }
              } catch (e) {}
            });
          }
        }
      }, 300);
    }

    function handleInputPress(btnId, isDown) {
      const val = isDown ? 1 : 0;

      if (roomId && isGuest) {
        if (dataConn && dataConn.open) {
          dataConn.send({ b: btnId, v: val });
        }
        return;
      }

      // Хост керує ПОРТОМ 0
      sendEjsInput(0, btnId, val);
    }

    document.querySelectorAll('[data-btn]').forEach(elem => {
      const btnId = parseInt(elem.getAttribute('data-btn'), 10);

      const down = (e) => {
        e.preventDefault();
        elem.classList.add('pressed');
        handleInputPress(btnId, true);
      };

      const up = (e) => {
        e.preventDefault();
        elem.classList.remove('pressed');
        handleInputPress(btnId, false);
      };

      elem.addEventListener('pointerdown', down);
      elem.addEventListener('pointerup', up);
      elem.addEventListener('pointercancel', up);
      elem.addEventListener('pointerleave', up);
    });
  </script>
</body>
</html>

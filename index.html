<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DendyGram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      /* Прибираємо синє виділення при тапах на мобілках */
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      margin: 0;
      background: #121214;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }

    .console {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 820px;
      background: #272730;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 2px 3px rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      padding: 12px 8px;
      touch-action: none;
    }

    .screen-bezel {
      background: #111113;
      border-radius: 16px;
      padding: 8px 8px 6px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 4px;
    }

    .brand {
      color: #71717a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 6px;
      transition: color 0.3s ease;
      text-transform: uppercase;
    }

    #game-container {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    #game {
      width: 100% !important;
      height: 100% !important;
    }

    #game canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      image-rendering: pixelated;
    }

    /* Гасимо тільки наекранний геймпад і системне меню */
    #game .ejs_virtual_gamepad,
    #game .ejs_menu,
    #game .ejs_start_screen,
    #game [id*="controls_menu"],
    #game [id*="gamepad_menu"] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 4px 10px;
    }

    .main-pads {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 2px;
    }

    .dpad {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .dpad-btn {
      position: absolute;
      background: #1c1c22;
      border: 2px solid #0f0f13;
      box-shadow: 0 4px 0 #09090b;
      border-radius: 6px;
      cursor: pointer;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      box-shadow: 0 1px 0 #09090b;
      transform: translateY(3px);
      background: #2b2b35;
    }

    .dpad-up { top: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-down { bottom: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-left { top: 45px; left: 0; width: 45px; height: 40px; }
    .dpad-right { top: 45px; right: 0; width: 45px; height: 40px; }
    .dpad-center {
      position: absolute;
      top: 45px;
      left: 45px;
      width: 40px;
      height: 40px;
      background: #1c1c22;
    }

    .action-buttons {
      display: flex;
      gap: 14px;
      transform: rotate(-25deg);
      margin-right: 2px;
    }

    .action-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dc2626;
      border: 2px solid #7f1d1d;
      box-shadow: 0 5px 0 #500724;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .action-btn:active, .action-btn.pressed {
      box-shadow: 0 1px 0 #500724;
      transform: translateY(4px);
      background: #ef4444;
    }

    .system-pads {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 8px;
    }

    .sys-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .sys-btn {
      width: 48px;
      height: 14px;
      background: #52525b;
      border: 1px solid #27272a;
      border-radius: 8px;
      transform: rotate(-25deg);
      box-shadow: 0 2px 0 #18181b;
      cursor: pointer;
    }

    .sys-btn:active, .sys-btn.pressed {
      box-shadow: none;
      transform: rotate(-25deg) translateY(2px);
    }

    .sys-label {
      font-size: 10px;
      color: #a1a1aa;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="console">
    <div class="screen-bezel">
      <div id="game-container">
        <div id="game"></div>
      </div>
      <div class="brand">DENDYGRAM • PORTABLE</div>
    </div>

    <div class="controls">
      <div class="main-pads">
        <div class="dpad">
          <div class="dpad-center"></div>
          <div class="dpad-btn dpad-up" data-btn="4"></div>
          <div class="dpad-btn dpad-down" data-btn="5"></div>
          <div class="dpad-btn dpad-left" data-btn="6"></div>
          <div class="dpad-btn dpad-right" data-btn="7"></div>
        </div>

        <div class="action-buttons">
          <div class="action-btn" data-btn="0">B</div>
          <div class="action-btn" data-btn="1">A</div>
        </div>
      </div>

      <div class="system-pads">
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="2"></div>
          <span class="sys-label">SELECT</span>
        </div>
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-btn="3"></div>
          <span class="sys-label">START</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    function decodeBase64Url(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return decodeURIComponent(escape(atob(str)));
    }

    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const urlParams = new URLSearchParams(window.location.search);

    let appData = {};
    const rawApp = hashParams.get('app');
    if (rawApp) {
      try {
        appData = JSON.parse(decodeBase64Url(rawApp));
      } catch (e) {
        console.error("Помилка декодування:", e);
      }
    }

    let targetRom = appData.rom || hashParams.get('rom') || urlParams.get('rom') || urlParams.get('startapp') || tg?.initDataUnsafe?.start_param;
    const roomId = appData.room || hashParams.get('room') || urlParams.get('room');
    const playerNum = parseInt(appData.p || hashParams.get('player') || urlParams.get('player') || '1', 10);

    const brandElem = document.querySelector('.brand');
    if (roomId && brandElem) {
      brandElem.textContent = `DENDYGRAM • DUO (PLAYER ${playerNum})`;
      brandElem.style.color = playerNum === 1 ? '#38bdf8' : '#34d399';
    }

    if (targetRom) {
      try {
        if (!targetRom.startsWith('http')) {
          targetRom = decodeBase64Url(targetRom);
        } else {
          targetRom = decodeURIComponent(targetRom);
        }
      } catch (e) {
        console.error("Помилка розкодування targetRom:", e);
      }

      window.EJS_player = '#game';
      window.EJS_core = 'nes';
      window.EJS_gameUrl = targetRom;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_alignStartButton = false;
      window.EJS_disableToolbar = true;
      window.EJS_VirtualGamepadSettings = [0, 0];
      window.EJS_mouse = false;

      // Примусово вказуємо підтримку двох гравців у системі керування
      window.EJS_defaultPlayers = 2;

      // Підключаємо netplay без режиму важкого ретранслятора
      if (roomId) {
        window.EJS_netplayUrl = 'wss://netplay.emulatorjs.org';
        window.EJS_gameId = `nes_room_${roomId}`;
      }

      // Ініціалізація геймпадів після готовності емулятора
      window.EJS_onGameStart = () => {
        try {
          if (window.EJS_emulator?.controls) {
            // Гарантуємо ініціалізацію обох портів
            if (!window.EJS_emulator.controls.ports) {
              window.EJS_emulator.controls.ports = [{}, {}];
            }
          }
        } catch (e) {}
      };

      const loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(loader);
    }

    // Карта кнопок: 0: B, 1: A, 2: SELECT, 3: START, 4: UP, 5: DOWN, 6: LEFT, 7: RIGHT
    function sendButtonState(btnId, isDown) {
      const val = isDown ? 1 : 0;
      // P1 керує портом 0, P2 керує портом 1
      const port = (roomId && playerNum === 2) ? 1 : 0;

      try {
        if (window.EJS_emulator?.controls?.simulateButton) {
          window.EJS_emulator.controls.simulateButton(port, btnId, val);
          // Додатковий мапінг для кнопки A
          if (btnId === 1) {
            window.EJS_emulator.controls.simulateButton(port, 8, val);
          }
        }
      } catch (err) {}
    }

    // Обробники тапу (без haptic/vibrate і без виділень)
    document.querySelectorAll('[data-btn]').forEach(elem => {
      const btnId = parseInt(elem.getAttribute('data-btn'), 10);

      const handlePress = (e) => {
        e.preventDefault();
        elem.classList.add('pressed');
        sendButtonState(btnId, true);
      };

      const handleRelease = (e) => {
        e.preventDefault();
        elem.classList.remove('pressed');
        sendButtonState(btnId, false);
      };

      elem.addEventListener('pointerdown', handlePress);
      elem.addEventListener('pointerup', handleRelease);
      elem.addEventListener('pointercancel', handleRelease);
      elem.addEventListener('pointerleave', handleRelease);
    });
  </script>
</body>
</html>

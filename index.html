<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DendyGram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      background: #121214;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }

    .console {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 820px;
      background: #272730;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 2px 3px rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      padding: 10px 8px;
      touch-action: none;
    }

    .screen-bezel {
      background: #111113;
      border-radius: 16px;
      padding: 8px 8px 6px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 4px;
    }

    .brand {
      color: #71717a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 6px;
      transition: color 0.3s ease;
    }

    #game-container {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    #game {
      width: 100% !important;
      height: 100% !important;
    }

    /* Ховаємо виключно меню налаштувань і тач-оверлей, канвас НЕ чіпаємо! */
    .ejs_menu,
    .ejs_menu_button,
    .ejs_touch_dpad,
    .ejs_touch_buttons {
      display: none !important;
    }

    .controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 4px 6px;
    }

    .main-pads {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 2px;
    }

    .dpad {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .dpad-btn {
      position: absolute;
      background: #1c1c22;
      border: 2px solid #0f0f13;
      box-shadow: 0 4px 0 #09090b;
      border-radius: 6px;
      cursor: pointer;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      box-shadow: 0 1px 0 #09090b;
      transform: translateY(3px);
      background: #2b2b35;
    }

    .dpad-up { top: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-down { bottom: 0; left: 45px; width: 40px; height: 45px; }
    .dpad-left { top: 45px; left: 0; width: 45px; height: 40px; }
    .dpad-right { top: 45px; right: 0; width: 45px; height: 40px; }
    .dpad-center {
      position: absolute;
      top: 45px;
      left: 45px;
      width: 40px;
      height: 40px;
      background: #1c1c22;
    }

    .action-buttons {
      display: flex;
      gap: 14px;
      transform: rotate(-25deg);
      margin-right: 2px;
    }

    .action-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dc2626;
      border: 2px solid #7f1d1d;
      box-shadow: 0 5px 0 #500724;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .action-btn:active, .action-btn.pressed {
      box-shadow: 0 1px 0 #500724;
      transform: translateY(4px);
      background: #ef4444;
    }

    /* Вікно логів над SELECT / START */
    #debug-box {
      background: #111113;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 6px 8px;
      height: 52px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 10px;
      line-height: 1.3;
      margin: 4px 6px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }

    .log-line {
      word-break: break-all;
      margin-bottom: 2px;
    }

    .system-pads {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 4px;
    }

    .sys-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .sys-btn {
      width: 48px;
      height: 14px;
      background: #52525b;
      border: 1px solid #27272a;
      border-radius: 8px;
      transform: rotate(-25deg);
      box-shadow: 0 2px 0 #18181b;
      cursor: pointer;
    }

    .sys-btn:active, .sys-btn.pressed {
      box-shadow: none;
      transform: rotate(-25deg) translateY(2px);
    }

    .sys-label {
      font-size: 10px;
      color: #a1a1aa;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="console">
    <div class="screen-bezel">
      <div id="game-container">
        <div id="game"></div>
      </div>
      <div class="brand">DENDYGRAM • PORTABLE</div>
    </div>

    <div class="controls">
      <div class="main-pads">
        <div class="dpad">
          <div class="dpad-center"></div>
          <div class="dpad-btn dpad-up" data-key="ArrowUp"></div>
          <div class="dpad-btn dpad-down" data-key="ArrowDown"></div>
          <div class="dpad-btn dpad-left" data-key="ArrowLeft"></div>
          <div class="dpad-btn dpad-right" data-key="ArrowRight"></div>
        </div>

        <div class="action-buttons">
          <div class="action-btn" data-key="KeyZ">B</div>
          <div class="action-btn" data-key="KeyX">A</div>
        </div>
      </div>

      <!-- ЛОГИ ПРЯМО НАД SELECT / START -->
      <div id="debug-box"></div>

      <div class="system-pads">
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-key="ShiftLeft"></div>
          <span class="sys-label">SELECT</span>
        </div>
        <div class="sys-btn-wrap">
          <div class="sys-btn" data-key="Enter"></div>
          <span class="sys-label">START</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const logBox = document.getElementById('debug-box');
    function log(msg, color = '#38bdf8') {
      const line = document.createElement('div');
      line.className = 'log-line';
      line.style.color = color;
      line.textContent = `> ${msg}`;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    log("Система ініціалізована", "#a1a1aa");

    function decodeBase64Url(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return decodeURIComponent(escape(atob(str)));
    }

    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const urlParams = new URLSearchParams(window.location.search);

    let targetRom = hashParams.get('rom') || urlParams.get('rom') || urlParams.get('startapp') || tg?.initDataUnsafe?.start_param;
    const roomId = hashParams.get('room') || urlParams.get('room');
    const playerNum = parseInt(hashParams.get('player') || urlParams.get('player') || '1', 10);

    const brandElem = document.querySelector('.brand');
    if (roomId && brandElem) {
      brandElem.textContent = `DENDYGRAM • DUO (P${playerNum})`;
      brandElem.style.color = playerNum === 1 ? '#38bdf8' : '#34d399';
    }

    log(`Режим: ${roomId ? 'DUO (P' + playerNum + ')' : 'SOLO'}`);
    if (roomId) log(`Room ID: ${roomId}`);

    if (targetRom) {
      try {
        if (!targetRom.startsWith('http')) {
          targetRom = decodeBase64Url(targetRom);
        } else {
          targetRom = decodeURIComponent(targetRom);
        }
      } catch (e) {
        log("Помилка декоду РОМу: " + e.message, "#ef4444");
      }

      log("Запуск ядра EmulatorJS...", "#fbbf24");

      window.EJS_player = '#game';
      window.EJS_core = 'nes';
      window.EJS_gameUrl = targetRom;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_alignStartButton = false;
      window.EJS_disableToolbar = true;
      window.EJS_VirtualGamepadSettings = [0, 0];

      window.EJS_onGameStart = () => {
        log("✅ Гра запущена на емуляторі!", "#22c55e");
      };

      const loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      loader.onerror = () => log("❌ Не вдалося завантажити loader.js!", "#ef4444");
      document.body.appendChild(loader);
    } else {
      log("❌ РОМ не знайдено в URL!", "#ef4444");
    }

    // P2P PeerJS з детальним логуванням
    let dataConn = null;

    if (roomId) {
      const roomTag = 'dendygram_' + roomId;

      if (playerNum === 1) {
        log("P1: Реєстрація кімнати в P2P...", "#a1a1aa");
        const peer = new Peer(roomTag);

        peer.on('open', (id) => {
          log(`P1 готовий! ID: ${id}`, "#38bdf8");
        });

        peer.on('connection', (conn) => {
          dataConn = conn;
          log("🤝 P2 підключився до гри!", "#22c55e");
          if (brandElem) brandElem.textContent = "DENDYGRAM • DUO CONNECTED!";

          conn.on('data', (data) => {
            if (data && data.btnId !== undefined) {
              try {
                window.EJS_emulator?.controls?.simulateButton(1, data.btnId, data.val);
              } catch (err) {}
            }
          });

          conn.on('close', () => {
            log("⚠️ P2 відключився", "#f59e0b");
          });
        });

        peer.on('error', (err) => {
          log(`P1 помилка Peer: ${err.type}`, "#f59e0b");
        });
      } else {
        log("P2: Підключення до хоста...", "#a1a1aa");
        const peer = new Peer();

        peer.on('open', () => {
          log("P2: Peer готовий, шукаю хоста...", "#a1a1aa");
          const conn = peer.connect(roomTag, { reliable: true });
          dataConn = conn;

          conn.on('open', () => {
            log("✅ Підключено до P1 (Хоста)!", "#22c55e");
            if (brandElem) brandElem.textContent = "DENDYGRAM • CONNECTED TO P1";
          });

          conn.on('close', () => {
            log("⚠️ Зв'язок із хостом втрачено", "#ef4444");
          });
        });

        peer.on('error', (err) => {
          log(`P2 помилка Peer: ${err.type}`, "#f59e0b");
        });
      }
    }

    // Керування
    const ejsBtnMap = {
      KeyZ: 0,
      KeyX: 8,
      ShiftLeft: 2,
      Enter: 3,
      ArrowUp: 4,
      ArrowDown: 5,
      ArrowLeft: 6,
      ArrowRight: 7
    };

    function triggerKey(code, type) {
      const isDown = (type === 'keydown');
      const val = isDown ? 1 : 0;
      const btnId = ejsBtnMap[code];
      if (btnId === undefined) return;

      if (roomId && playerNum === 2) {
        if (dataConn && dataConn.open) {
          dataConn.send({ btnId, val });
        }
        try {
          window.EJS_emulator?.controls?.simulateButton(1, btnId, val);
        } catch (e) {}
        return;
      }

      try {
        window.EJS_emulator?.controls?.simulateButton(0, btnId, val);
      } catch (err) {}
    }

    document.querySelectorAll('[data-key]').forEach(elem => {
      const code = elem.getAttribute('data-key');

      const handlePress = (e) => {
        e.preventDefault();
        elem.classList.add('pressed');
        if (tg?.HapticFeedback) {
          tg.HapticFeedback.impactOccurred('medium');
        } else if (navigator.vibrate) {
          navigator.vibrate(12);
        }
        triggerKey(code, 'keydown');
      };

      const handleRelease = (e) => {
        e.preventDefault();
        elem.classList.remove('pressed');
        triggerKey(code, 'keyup');
      };

      elem.addEventListener('pointerdown', handlePress);
      elem.addEventListener('pointerup', handleRelease);
      elem.addEventListener('pointercancel', handleRelease);
      elem.addEventListener('pointerleave', handleRelease);
    });
  </script>
</body>
</html>
